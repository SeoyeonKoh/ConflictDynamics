conflict_events:
- id: E01
  type: task_dependency_failure
  theory_tags:
  - S20
  - S21
  - S23
  observable_fact: A required predecessor misses its due tick or fails an acceptance criterion.
  possible_interactions:
  - recovery_request
  - blame_attribution
  - owner_confirmation
- id: E02
  type: deadline_compression
  theory_tags:
  - S22
  - S25
  observable_fact: The release due tick moves earlier while recorded scope or quality criteria stay fixed.
  possible_interactions:
  - scope_tradeoff
  - overtime_request
  - quality_risk_escalation
- id: E03
  type: scarce_resource_competition
  theory_tags:
  - S24
  - S25
  observable_fact: Two ready tasks require the same unavailable specialist or test environment.
  possible_interactions:
  - priority_request
  - allocation_dispute
  - transparent_reallocation
- id: E04
  type: priority_disagreement
  theory_tags:
  - S20
  - S22
  observable_fact: Two functions submit incompatible ranked outcomes for one accountable decision.
  possible_interactions:
  - evidence_challenge
  - coalition_building
  - accountable_decision
- id: E05
  type: role_ambiguity_or_overlap
  theory_tags:
  - S23
  observable_fact: A task has conflicting or missing ownership, review, or approval references.
  possible_interactions:
  - duplicate_work
  - ownership_request
  - raci_clarification
- id: E06
  type: unequal_workload_allocation
  theory_tags:
  - S24
  - S25
  observable_fact: Recorded assigned effort differs materially without a recorded allocation rationale.
  possible_interactions:
  - fairness_question
  - rebalance_request
  - constraint_explanation
- id: E07
  type: evaluation_or_promotion_salience
  theory_tags:
  - S03
  - S24
  observable_fact: Limited recognition or evaluation timing becomes salient during interdependent delivery.
  possible_interactions:
  - credit_claim
  - evidence_submission
  - information_withholding_risk
- id: E08
  type: information_delay_or_missing_handoff
  theory_tags:
  - S21
  - S23
  - S24
  observable_fact: A known update is not transferred to a named recipient by its due tick.
  possible_interactions:
  - status_request
  - downstream_rework
  - handoff_repair
- id: E09
  type: public_criticism_or_face_threat
  theory_tags:
  - S20
  - S22
  - S24
  observable_fact: Corrective feedback identifies an individual in a multi-attendee setting.
  possible_interactions:
  - defensive_reply
  - withdrawal
  - private_followup
- id: E10
  type: ignored_or_refused_request
  theory_tags:
  - S23
  - S24
  - S26
  observable_fact: A request receives no acknowledgement by its service-level tick or is refused without
    rationale.
  possible_interactions:
  - repeat_request
  - authority_escalation
  - rationale_and_repair
