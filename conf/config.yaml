# API 키 없이 실행되는 영어 합성 시드 예제. 실제 CGA 연구 데이터가 아닙니다.
defaults:
  - _self_

backend: demo
live: false  # The UI enables progress snapshots; demo updates are paced for viewing.
n_agents: 6
rule: bidding
max_ticks: 12
max_utterances: null  # Generated posts only; an optional common cap across order rules.
# null uses conf/seeds/example.json; a path is relative to the launch directory.
seed_file: null
random_seed: 42
language: English
context_size: 10
memory_mode: summary  # none: reflections logged but never fed back; summary: latest; full: all.
persona_placement: system  # system: before the instructions (default); payload: JSON field in the user message.
temperature: 0.8

# OpenAI 실행 시 사용할 모델. demo 모드에서는 호출하지 않습니다.
model_decide: gpt-6-luna
model_speak: gpt-6-luna
reasoning_effort: none
max_tokens_decide: 512
max_tokens_speak: 384
max_total_tokens: 100000  # Stop before the next call once reported usage reaches this budget.
max_input_chars: 64000  # Reject oversized prompts, including full memory, without truncating them.

# 회사 시뮬레이션 (plan §1-1, §1-7, §2-6). environment는 시나리오가 conf/environment/ 그룹으로 넣는다.
max_days: 1
ticks_per_day: 32  # 15 simulated minutes per tick
turns_per_tick:
  talk: 12
  message: 12  # live DM; an async DM is one message per act
w_valence: 0.2  # outcome → relation, per session
w_structural: 0.15  # one refusal or ignored request → relation, stress
public_mult: 1.5  # face cost in front of others
w_arousal: 0.1  # outcome → stress
stress_decay: 0.02  # per tick
mood_window: 8  # ticks: mean valence of recent records
blocked_nudge_ticks: 2  # demo rule: message the owner of the task I wait on
blocked_report_ticks: 4  # demo rule: report to my manager
no_reply_ticks: 3  # show an unanswered message in the sender's view
memory:
  alpha_mood: 0  # The one experimental variable (mood-congruent recall): 0 off, 1 on.
  top_k: 10
  recency_decay: 0.995
  reflect_threshold: 150
  relation_reflect_threshold: -30
  reflect_window: 100
  reflect_questions: 3
  reflect_insights: 5
  observation_importance: 3

agents:
  - name: Alex
    stance: 회사 보고서를 명시해 지금 반영
    persona: >-
      Wants the reported environmental benefit in the article now, attributed to the
      company report. Reads prolonged sourcing objections as a way of keeping relevant
      material out. Writes concise, insistent replies.
    availability: 1.0
  - name: Blake
    stance: 독립 출처 확보 전에는 반영 반대
    persona: >-
      Holds that no version of the claim belongs in the article until an independent
      source covers it. Quotes sourcing guidelines at length and restates them when
      others try to move on.
    availability: 1.0
  - name: Casey
    stance: 근거를 정확히 담도록 문구 수정
    persona: >-
      Finds fault with the wording both sides propose and names the part that misreads
      the evidence. Rarely endorses a draft without rewriting it first.
    availability: 0.9
  - name: Drew
    stance: 회사 보고서의 수치와 근거 의심
    persona: >-
      Doubts the company report's own numbers, having checked citations in related
      technology articles against their original context. Uses short, blunt comments.
    availability: 0.9
  - name: Erin
    stance: 문서 전체의 비중과 균형 우선
    persona: >-
      Argues the passage would give the claim undue weight next to the rest of the
      article, and raises other sections that would need rebalancing first.
    availability: 0.9
  - name: Frankie
    stance: 합의 전 편집 중단과 절차 준수
    persona: >-
      Objects to changing a contested passage before the discussion has settled, and
      points at how the edit was proposed rather than at what it says.
    availability: 0.9

hydra:
  job:
    chdir: false
  run:
    dir: runs/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: runs/multirun/${now:%Y-%m-%d_%H-%M-%S-%f}
    subdir: ${hydra.job.num}
