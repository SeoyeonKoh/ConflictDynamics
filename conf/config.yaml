# API 키 없이 실행되는 영어 합성 시드 예제. 실제 CGA 연구 데이터가 아닙니다.
defaults:
  - _self_

backend: demo
n_agents: 6
rule: bidding
max_ticks: 12
silence_limit: 2
# null uses conf/seeds/example.json; a path is relative to the launch directory.
seed_file: null
random_seed: 42
language: English
context_size: 10
temperature: 0.8

# 실제 호출 전에 JSON mode와 temperature를 지원하는 모델 ID를 지정하세요.
model_decide: null
model_speak: null

agents:
  - name: Alex
    persona: >-
      Wants the reported environmental benefit in the article now, attributed to the
      company report. Reads prolonged sourcing objections as a way of keeping relevant
      material out. Writes concise, insistent replies.
    availability: 1.0
  - name: Blake
    persona: >-
      Holds that no version of the claim belongs in the article until an independent
      source covers it. Quotes sourcing guidelines at length and restates them when
      others try to move on.
    availability: 1.0
  - name: Casey
    persona: >-
      Finds fault with the wording both sides propose and names the part that misreads
      the evidence. Rarely endorses a draft without rewriting it first.
    availability: 0.9
  - name: Drew
    persona: >-
      Doubts the company report's own numbers, having checked citations in related
      technology articles against their original context. Uses short, blunt comments.
    availability: 0.9
  - name: Erin
    persona: >-
      Argues the passage would give the claim undue weight next to the rest of the
      article, and raises other sections that would need rebalancing first.
    availability: 0.9
  - name: Frankie
    persona: >-
      Objects to changing a contested passage before the discussion has settled, and
      points at how the edit was proposed rather than at what it says.
    availability: 0.9

hydra:
  job:
    chdir: false
  run:
    dir: runs/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: runs/multirun/${now:%Y-%m-%d_%H-%M-%S-%f}
    subdir: ${hydra.job.num}
