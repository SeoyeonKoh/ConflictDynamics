# Korean version of p0_kickoff (2026-10-06): the same kickoff, task graph, department
# projects and meetings on the Korean preset, with Korean task, project and step names,
# documents and agendas. Agents speak and write Korean (language: Korean). Department ids
# stay English: the office map and project rotation key on them.
extends: s0_baseline
id: p0_kickoff_ko
research_question: 일을 나누고 결과를 공유하는 회의가 협업과 갈등을 바꾸는가?
manipulated_variable: 킥오프 회의의 업무 배분과 결과 리뷰 (한국어 버전)
preset: large_korean_enterprise_20_ko
language: Korean
