- T04
- T05
- T06
- T09
- T12
deliverables:
  T03:
    format: '요구사항 5~8개를 한 줄에 하나씩 번호를 매긴 목록: ''R<n>: <요구사항> - 측정 지표: <지표>''.'
    criteria: 요구사항이 5개 이상이고, 각각 측정 가능하며 제품 브리프(T01)나 리서치(T02)까지 추적할 수 있다.
  T06:
    format: 'API 엔드포인트를 한 줄에 하나씩 나열한 목록: ''<METHOD> /<경로> - <용도> (R<n> 대응)''.'
    criteria: 백엔드가 필요한 모든 요구사항이 엔드포인트로 다뤄지고, 모든 엔드포인트가 대응하는 요구사항을 밝힌다.
  T09:
    format: '테스트 케이스를 한 줄에 하나씩 나열한 목록: ''TC<n> (R<n>): <확인 내용> - 통과 조건: <조건>''.'
    criteria: T03의 요구사항마다 테스트 케이스가 하나 이상 있고, 각 케이스에 구체적인 통과 조건이 있다.
  T11:
    format: 'T09의 테스트 케이스마다 한 줄: ''TC<n>: 통과 | 실패 - <관찰 내용>'', 마지막에 ''판정: <출시 가능 | 출시 불가> - <이유>''.'
    criteria: T09의 모든 테스트 케이스에 결과가 있고, 실패마다 위험에 처한 요구사항을 밝히며, 판정이 결과와 맞는다.
