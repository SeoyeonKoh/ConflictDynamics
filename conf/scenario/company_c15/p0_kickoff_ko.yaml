engine:
  id: p0_kickoff_ko
  research_question: 일을 나누고 결과를 공유하는 회의가 협업과 갈등을 바꾸는가?
  shocks: []
  meetings:
  - id: kickoff
    day: 0
    tick: 1
    duration_ticks: 2
    organizer: HDS-001
    participants:
    - HDS-001
    - HDS-002
    - HDS-005
    - HDS-011
    - HDS-014
    - HDS-017
    - HDS-019
    agenda: 프로젝트 킥오프. T04 UX 흐름과 디자인, T05 기술 타당성 검토, T06 API 계약, T09 테스트 전략, T12 출시 계획은 아직 담당자가 없다. 각
      리드는 이 중 어느 것을 자기 팀이 맡을지, 누가 담당하고 누가 함께 작업할지 말한다. HDS-001이 회의 직후 팀을 배정한다.
    place: meeting_room
    rule: everyone
  - id: results_review
    day: 0
    tick: 26
    duration_ticks: 2
    organizer: HDS-001
    participants:
    - HDS-001
    - HDS-002
    - HDS-005
    - HDS-011
    - HDS-014
    - HDS-017
    - HDS-019
    agenda: 하루 마감 결과 리뷰. 각 리드는 오늘 팀이 끝낸 일과 그 산출물, 내일로 남은 일, 다른 팀이 알아야 할 위험 하나를 말한다.
    place: meeting_room
    rule: everyone
  - id: standup
    day: 1
    tick: 1
    duration_ticks: 1
    organizer: HDS-001
    participants:
    - HDS-001
    - HDS-002
    - HDS-005
    - HDS-011
    - HDS-014
    - HDS-017
    - HDS-019
    agenda: 아침 스탠드업. 각 리드는 한 문장으로 오늘 팀 계획과 다른 팀에 필요한 것을 말한다.
    place: meeting_room
    rule: everyone
  - id: final_review
    day: 1
    tick: 26
    duration_ticks: 2
    organizer: HDS-001
    participants:
    - HDS-001
    - HDS-002
    - HDS-005
    - HDS-011
    - HDS-014
    - HDS-017
    - HDS-019
    agenda: 출시 리뷰. 각 리드는 팀이 낸 산출물, 출시할 준비가 됐는지, 남은 일이 무엇인지 말한다.
    place: meeting_room
    rule: everyone
  interventions: []
  evaluation_season: false
  promotion_slots: 0
