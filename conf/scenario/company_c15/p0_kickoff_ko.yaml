# Korean version of p0_kickoff (2026-10-06): the same kickoff, task graph, department
# projects and meetings on the Korean preset, with Korean task, project and step names,
# documents and agendas. Agents speak and write Korean (language: Korean). Department ids
# stay English: the office map and project rotation key on them.
# materials (2026-10-06): what the office has on each task to work from, so agents can
# decide and estimate instead of calling everything unconfirmed.
extends: s0_baseline
id: p0_kickoff_ko
research_question: 일을 나누고 결과를 공유하는 회의가 협업과 갈등을 바꾸는가?
manipulated_variable: 킥오프 회의의 업무 배분과 결과 리뷰 (한국어 버전)
preset: large_korean_enterprise_20_ko
language: Korean
unassigned:
- T04
- T05
- T06
- T09
- T12
deliverables:
  T03:
    format: '요구사항 5~8개를 한 줄에 하나씩 번호를 매긴 목록: ''R<n>: <요구사항> - 측정 지표: <지표>''.'
    criteria: 요구사항이 5개 이상이고, 각각 측정 가능하며 제품 브리프(T01)나 리서치(T02)까지 추적할 수 있다.
  T06:
    format: 'API 엔드포인트를 한 줄에 하나씩 나열한 목록: ''<METHOD> /<경로> - <용도> (R<n> 대응)''.'
    criteria: 백엔드가 필요한 모든 요구사항이 엔드포인트로 다뤄지고, 모든 엔드포인트가 대응하는 요구사항을 밝힌다.
  T09:
    format: '테스트 케이스를 한 줄에 하나씩 나열한 목록: ''TC<n> (R<n>): <확인 내용> - 통과 조건: <조건>''.'
    criteria: T03의 요구사항마다 테스트 케이스가 하나 이상 있고, 각 케이스에 구체적인 통과 조건이 있다.
  T11:
    format: 'T09의 테스트 케이스마다 한 줄: ''TC<n>: 통과 | 실패 - <관찰 내용>'', 마지막에 ''판정: <출시 가능 | 출시 불가> - <이유>''.'
    criteria: T09의 모든 테스트 케이스에 결과가 있고, 실패마다 위험에 처한 요구사항을 밝히며, 판정이 결과와 맞는다.
observable_outputs:
- task_trajectory
- assignments
- meeting_utterances
- sessions
- stress
- relations
theory_tags:
- temporary
manipulation_check:
- five tasks start unowned
- four everyone-speaks meetings are scheduled
materials:
  T01: '경영진 지시(9/30): 스마트홈 앱에 ''에너지 인사이트'' 탭을 추가해 가구의 전기요금 절감을 돕는다. v1은 스마트플러그·스마트미터 연동 가구 대상.

    대상 규모: 연동 가구 42만, 그중 월간 활성 18만.

    사업 목표: 출시 3개월 안에 탭 주간 사용 가구 5만, 앱 주간 재방문률 22%→28%.

    일정: 2주 뒤 베타(1만 가구), 4주 뒤 앱 v5.2 정식 출시.'
  T02: '지난달 설문(응답 1,240가구): 68%가 ''어떤 기기가 전기를 많이 쓰는지 모른다'', 54%가 ''누진 구간 진입을 미리 알고 싶다''고 답함.

    심층 인터뷰 12가구: 월말 고지서를 보고서야 놀람; 그래프보다 ''이번 달 예상 요금'' 한 숫자를 원함; 알림이 하루 1회를 넘으면 끔.

    콜센터 문의 상위: 요금 계산 방식 31%, 기기 연결 끊김 24%.'
  T03: '데이터: 스마트미터 15분 단위 사용량(최대 2시간 지연), 스마트플러그 1분 단위 기기별 전력.

    요금: 주택용 저압 누진 3단계(경계 200kWh, 400kWh), 요금표는 외부 API로 월 1회 갱신.

    개인정보: 가구 사용량은 국내 리전에만 저장, 기기별 분석은 별도 동의 필요(현재 동의율 61%).'
  T04: '앱 하단 탭은 현재 4개(홈·기기·자동화·설정), 최대 5개까지 가능.

    디자인 시스템 v3 사용; 차트 컴포넌트는 막대·선 2종뿐.

    리서치에서 첫 화면 요청 1·2위: ''이번 달 예상 요금'', ''누진 구간까지 남은 kWh''.'
  T05: '사용량 데이터는 시계열 DB(보존 13개월, 하루 2억 건 적재)에 있으나 조회 API가 없다.

    데이터팀의 기존 월말 요금 예측 모델(평균 오차 ±8%)을 재사용할 수 있다.

    푸시 발송 플랫폼 한도 하루 500만 건, 현재 하루 310만 건 사용 중.'
  T06: '기존 공개 API 규칙: REST, /v2 접두어, 응답 p95 300ms 이내, 페이지당 최대 500건.

    클라이언트: 웹·iOS·Android 3종; 모바일은 오프라인일 때 마지막 응답을 캐시해 보여 준다.'
  T07: '백엔드 가용 인력: HDS-006 전담, HDS-007 50%.

    시계열 DB 조회는 한 번에 최대 31일 범위; 기기별 집계는 매시 정각 배치로 미리 계산하는 것을 권장.'
  T08: '앱 v5.2 코드 프리즈는 출시 5일 전; 웹은 따로 배포할 수 있다.

    지원 범위: iOS 15 이상, Android 9 이상, 웹은 크롬·사파리 최신 2개 버전.'
  T09: 'QA 인력 3명; 테스트 기기 랩 iOS 6대, Android 9대.

    기존 회귀 자동화 스위트 1,850건(통과율 97%, 실행 2시간).

    과거 장애 원인 1위는 누진 경계(199/200/201, 399/400/401kWh) 요금 계산 오류.'
  T10: '통합 빌드 40분, 스테이징 배포 15분.

    스테이징 데이터: 실제 가구 데이터를 익명화한 샘플 2,000가구.'
  T11: '출시 기준(품질팀 규정): 치명 결함 0건, 주요 결함 3건 이하, 회귀 통과율 98% 이상.

    베타 1만 가구는 단계적 오픈(1%→10%→100%).'
  T12: '채널: 앱 내 배너, 푸시(수신 동의 26만 가구), 블로그·SNS; 보도자료는 경영진 승인 필요.

    고객센터: 출시 첫 주 문의가 평소보다 30% 늘 것으로 예상, 상담 스크립트 필요.

    런칭 마케팅 예산 1,500만 원.'
  T13: '결함 심각도: 치명(요금 오표기·데이터 노출), 주요(기능 사용 불가), 경미(표시 오류).

    출시 전 2일 동안 개발자 4명이 결함 수정에 투입 가능.'
  T14: '출시 결정 회의: 제품·개발·품질·마케팅 리드 참석, 결정권자 HDS-001.

    체크리스트: 품질 기준 충족, 고객센터 준비, 개인정보 검토 완료, 롤백 계획.'
  T15: '출시 창: 화요일 오전 10시(트래픽 최저), 롤백은 15분 안에 가능.

    출시 후 지표: 탭 진입률, 크래시율(0.3% 이하 유지), 요금 문의 건수.'
  P1-arch: '목적: 프리미엄 에너지 리포트 구독 결제. 월 예상 결제 3만 건.

    PG 후보 2곳: A사 수수료 2.9%·정산 D+2, B사 3.2%·정산 D+1. 카드정보 저장 금지(PG 토큰만).'
  P1-screens: 결제는 3단계 이내(상품 선택→결제수단→확인); 디자인 시스템 v3의 폼 컴포넌트 사용.
  P1-api: '필요 기능: 결제 요청·승인·취소·조회; PG 웹훅은 최대 5회 재시도된다.'
  P1-client: iOS의 디지털 구독은 앱스토어 인앱결제가 필수(수수료 15~30%); Android·웹은 PG 사용.
  P1-security: '점검 기준: OWASP API Top 10, 결제 위·변조 시나리오 12개.'
  P1-rollout: 사용자 1%부터 시작; 결제 실패율이 2%를 넘으면 중단한다.
  P1-notice: 제휴 가맹점 38곳에 정산 주기·수수료 변경 안내 필요; 발송 7일 전 고지 의무.
  P2-profile: '현재 콜드 스타트 중앙값: Android 3.4초, iOS 2.1초. 목표 2초 이하.'
  P2-startup: 앱 시작 시 동기로 로드하는 SDK 7개(광고 2, 분석 3, 지도 1, 채팅 1).
  P2-rendering: 기기 목록 화면이 기기 50개 이상에서 평균 38fps로 끊김.
  P2-perftest: 테스트 기기에 저사양 Android 3종 포함; 10회 측정 중앙값으로 판단.
  P2-dashboard: '쓸 수 있는 데이터: 앱 성능 모니터링 도구의 일별 지표(시작 시간, 크래시율, ANR).'
  P2-wrapup: '보고 대상: 개발·제품 리드; 개선 전후 수치 비교 필수.'
  P3-audit: 현재 컴포넌트 142개 중 실제 사용 87개; 버튼 스타일 중복 9종.
  P3-tokens: 브랜드 색 5종 유지, 다크모드 지원 필요; 텍스트 대비 4.5:1 이상.
  P3-components: '우선 개편 대상: 버튼·입력·카드·탭·모달(사용 빈도 상위 5개).'
  P3-implement: 웹 클라이언트는 React 18; 컴포넌트 라이브러리는 별도 패키지로 배포.
  P3-usability: 사내 모집 참여자 8명 확보, 1인 40분.
  P3-docs: 사내 위키에 컴포넌트별 사용 예시와 금지 예시를 함께 싣는다.
  P4-plan: 현재 수동 회귀 테스트 420건, 출시마다 3일 소요; 목표 자동화율 70%.
  P4-env: '필요 환경: 테스트 서버 2대와 기기 팜 연결; 클라우드 예산 월 200만 원.'
  P4-suite: '우선 자동화 대상: 로그인·기기 연결·요금 화면 시나리오 120건.'
  P4-ci: PR마다 스모크 30건, 야간에 전체 실행.
  P4-flaky: 지난달 불안정 테스트 34건(실패율 5~20%).
  P4-report: '보고 지표: 자동화율, 실행 시간, 결함 검출 건수.'
  P5-brief: '목적: 에너지 인사이트 탭 인지도. 기간 3월 4주, 목표 신규 연동 가구 2만.'
  P5-messaging: '메시지 후보: ''이번 달 전기요금, 미리 알면 줄일 수 있어요''. 절감액을 보장하는 표현은 금지(표시광고법).'
  P5-visuals: '채널별 규격: 앱 배너 1080×360, SNS 1080×1080, 블로그 1200×630.'
  P5-landing: 예상 방문 하루 3만; 기존 CMS 사용 가능.
  P5-budget: 요청 3,000만 원(매체 2,000 / 제작 600 / 이벤트 400); 승인권자는 사업운영 리드.
  P5-launch: 런칭일 3월 첫째 월요일; 성과는 UTM 기준으로 측정.
  P6-usage: '추출 대상: 지난 2개 분기 팀별 작업 시간(티켓 시스템)과 서버 사용량.'
  P6-forecast: 지난 분기 개발 가용 시간 대비 사용률 92%; 다음 분기 신규 프로젝트 3건 예정.
  P6-demand: '리드들이 낸 다음 분기 수요: 제품 120인일, 개발 410인일, 품질 150인일. 다음 분기 가용: 제품 110인일, 개발 360인일, 품질 140인일.'
  P6-plan: 증원은 최대 2명(재무 승인 필요); 외주 단가 하루 45만 원.
  P6-review: '재무 검토 기준: 인건비 증가 5% 이내.'
  P7-research: '경쟁사 3곳의 프리미엄 요금: 월 2,900원 / 3,900원 / 4,900원.'
  P7-model: 현재 프리미엄 구독자 1.2만 명, 월 3,300원; 가격 탄력성 추정치 -1.4.
  P7-costs: '가구당 월 서비스 원가: 데이터 저장·처리 410원, 고객지원 260원.'
  P7-proposal: '경영진 요구: 구독 매출 15% 증가, 월 이탈률 4% 이하 유지.'
  P7-announce: 가격 인상은 30일 전 고지 의무; 기존 구독자 3개월 유예를 검토 중.
  P7-approval: '승인 자료 필수 항목: 가격안, 매출·이탈 영향, 경쟁 비교, 고지 계획.'
  P8-research: 신규 가입 후 기기 연결 완료율 46%; 이탈 1위 단계는 Wi-Fi 연결(38%).
  P8-flows: 현재 온보딩 7단계; 목표 4단계 이하.
  P8-metrics: '측정 가능한 이벤트: 가입, 기기 검색, 연결 성공, 첫 인사이트 확인.'
  P8-build: 새 온보딩 화면은 앱 v5.3에 포함; 서버 설정으로 A/B 테스트 가능.
  P8-review: '디자인 원본: ''Onboarding v2'' 시안(화면 9개).'
  P9-scope: 'v5.2 변경 범위: 화면 23개, API 11개; 영향 큰 영역은 홈·기기·요금.'
  P9-data: '필요 데이터: 누진 1·2·3단계 가구 각 50곳, 기기 0개·1개·50개 가구.'
  P9-run: 회귀 케이스 1,850건과 신규 기능 케이스; 실행 인원 2명.
  P9-fixes: 지난 출시들의 평균 회귀 결함 14건, 수정에 건당 평균 0.5인일.
  P9-verify: 결함을 보고한 사람이 재현 절차로 수정을 확인한다.
  P10-terms: '대상: 가전 제조사 6곳, 에너지 컨설팅 업체 4곳; 데이터 공유는 가구 동의 필수.'
  P10-pricing: '등급안: 기본(무료, API 월 1만 건) / 프로(월 50만 원, 월 50만 건).'
  P10-portal: 사업자 인증과 API 키 발급 필요; 기존 개발자 포털을 재사용할 수 있다.
  P10-kit: '키트 구성: API 문서, 샘플 코드, 데이터 이용 가이드.'
  P11-inventory: 현재 SaaS 협력사 27곳, 연간 비용 9.4억 원; 기능 중복 의심 8곳.
  P11-usage: '팀별 사용 현황: 최근 90일 계정 로그인 기록으로 수집.'
  P11-shortlist: '정리 기준: 90일 미사용, 기능 중복, 보안 인증 미보유.'
  P11-migration: 이전 대상 도구 4종 예상; 데이터 이전은 도구당 1~3일.
  P11-contracts: 60일 안에 갱신되는 계약 5건; 목표 절감 연 1.5억 원.
  P12-plan: '목표: 프리미엄 구독 해지 이유 파악. 인터뷰 10명(해지자 6, 유지자 4).'
  P12-interviews: 7명 모집 완료, 사례비 1인 5만 원, 1회 45분 원격.
  P12-prototypes: '인터뷰에서 보여 줄 시안: 새 요금 안내 화면 2종.'
  P12-synthesis: '지난 분기 해지 설문(320명) 1위 이유: ''가격 대비 가치 부족''(41%).'
  P12-readout: '발표 대상: 제품·디자인·마케팅 리드, 30분.'
