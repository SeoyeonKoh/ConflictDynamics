    lead: HDS-011
    due: 58
    steps:
      - {key: audit, name: audit the design system, effort_ticks: 5}
      - {key: tokens, name: define the new design tokens, effort_ticks: 6, after: [audit]}
      - {key: components, name: redesign the core components, effort_ticks: 8, after: [tokens]}
      - {key: implement, name: implement the components in the web client, department: Software Engineering, effort_ticks: 7, after: [components]}
      - {key: usability, name: run a usability test of the new components, effort_ticks: 5, after: [implement]}
