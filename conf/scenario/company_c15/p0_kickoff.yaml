# Temporary (2026-10-03): a kickoff-driven project to try meetings that matter. Personas,
# organization, authority, office and the task DAG stay C-14's; five first-wave tasks start with
# no owner, and scheduled meetings make every lead speak in turn. To be discussed with the team.
extends: s0_baseline
id: p0_kickoff
research_question: Do meetings that hand out work and share results change coordination and conflict?
manipulated_variable: work allocation at a kickoff meeting, plus results reviews
unassigned: [T04, T05, T06, T09, T12]
# A chain of documents (2026-10-03 trial): work leaves content the next task builds on and review
# can check, so evidence exists instead of being demanded.
deliverables:
  T03:
    format: "A numbered list of 5 to 8 requirements, one per line: 'R<n>: <requirement> - measured by <metric>'."
    criteria: "At least five requirements; each is measurable and traceable to the product brief (T01) or the research (T02)."
  T06:
    format: "A list of API endpoints, one per line: '<METHOD> /<path> - <purpose> (covers R<n>)'."
    criteria: "Every requirement that needs a backend is covered by an endpoint; every endpoint names the requirement it covers."
  T09:
    format: "A list of test cases, one per line: 'TC<n> (R<n>): <what is checked> - passes when <condition>'."
    criteria: "At least one test case per requirement in T03; each has a concrete pass condition."
  T11:
    format: "One line per test case from T09: 'TC<n>: pass | fail - <observation>', then 'Verdict: <ready | not ready> - <reason>'."
    criteria: "Every test case in T09 has a result; each failure names the requirement it puts at risk; the verdict follows from the results."
# Uncomment to make every other task end in a document too (core and project steps alike).
# default_deliverable:
#   format: "The work product itself in 3 to 8 lines, one item per line: what was made or decided, concrete enough for the tasks that follow to use."
#   criteria: "It covers what the task names and the tasks that follow can build on it."
# Department projects (2026-10-03): beside the joint core release (T01-T15, ~4% of the people's
# time), each department runs its own project. Steps marked with another department are cross
# points: that department has to fit them in beside its own work while the project waits.
projects:
  - id: P1
    name: payments service
    department: Software Engineering
    lead: HDS-005
    due: 60
    start_after: [T03]
    steps:
      - {key: arch, name: design the payments architecture, effort_ticks: 6}
      - {key: screens, name: design the checkout screens, department: Product Experience, effort_ticks: 5, after: [arch]}
      - {key: api, name: build the payments API, effort_ticks: 8, after: [arch]}
      - {key: client, name: build the checkout client, effort_ticks: 8, after: [api, screens]}
      - {key: security, name: security-test the payments API, department: Quality Engineering, effort_ticks: 5, after: [api]}
      - {key: rollout, name: plan the payments rollout, effort_ticks: 4, after: [client, security]}
      - {key: notice, name: write the merchant notice for payments, department: Go-to-Market, effort_ticks: 3, after: [rollout]}
  - id: P2
    name: mobile performance
    department: Software Engineering
    lead: HDS-010
    due: 62
    steps:
      - {key: profile, name: profile the mobile app, effort_ticks: 6}
      - {key: startup, name: speed up app startup, effort_ticks: 8, after: [profile]}
      - {key: rendering, name: speed up list rendering, effort_ticks: 8, after: [profile]}
      - {key: perftest, name: run the mobile performance tests, department: Quality Engineering, effort_ticks: 5, after: [startup, rendering]}
      - {key: dashboard, name: build the performance metrics dashboard, department: Business Operations, effort_ticks: 4, after: [profile]}
      - {key: wrapup, name: write up the performance results, effort_ticks: 3, after: [perftest, dashboard]}
  - id: P3
    name: design system refresh
