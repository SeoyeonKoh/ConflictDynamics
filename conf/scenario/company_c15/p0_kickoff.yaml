# Temporary (2026-10-03): a kickoff-driven project to try meetings that matter. Personas,
# organization, authority, office and the task DAG stay C-14's; five first-wave tasks start with
# no owner, and scheduled meetings make every lead speak in turn. To be discussed with the team.
extends: s0_baseline
id: p0_kickoff
research_question: Do meetings that hand out work and share results change coordination and conflict?
manipulated_variable: work allocation at a kickoff meeting, plus results reviews
unassigned: [T04, T05, T06, T09, T12]
# A chain of documents (2026-10-03 trial): work leaves content the next task builds on and review
# can check, so evidence exists instead of being demanded.
deliverables:
  T03:
    format: "A numbered list of 5 to 8 requirements, one per line: 'R<n>: <requirement> - measured by <metric>'."
    criteria: "At least five requirements; each is measurable and traceable to the product brief (T01) or the research (T02)."
  T06:
    format: "A list of API endpoints, one per line: '<METHOD> /<path> - <purpose> (covers R<n>)'."
    criteria: "Every requirement that needs a backend is covered by an endpoint; every endpoint names the requirement it covers."
  T09:
    format: "A list of test cases, one per line: 'TC<n> (R<n>): <what is checked> - passes when <condition>'."
    criteria: "At least one test case per requirement in T03; each has a concrete pass condition."
  T11:
    format: "One line per test case from T09: 'TC<n>: pass | fail - <observation>', then 'Verdict: <ready | not ready> - <reason>'."
    criteria: "Every test case in T09 has a result; each failure names the requirement it puts at risk; the verdict follows from the results."
engine:
  id: p0_kickoff
  research_question: Do meetings that hand out work and share results change coordination and conflict?
  shocks: []
  meetings:
    - id: kickoff
      day: 0
      tick: 1
      duration_ticks: 2
      organizer: HDS-001
      participants: [HDS-001, HDS-002, HDS-005, HDS-011, HDS-014, HDS-017, HDS-019]
      agenda: >-
        Project kickoff. T04 ux flow and design, T05 technical feasibility, T06 api contract, T09
        test strategy and T12 launch plan have no owner yet. Each lead: say which of them your team
        takes and who should own it; HDS-001 assigns the owners right after this meeting.
      place: meeting_room
      rule: everyone
    - id: results_review
      day: 0
      tick: 26
      duration_ticks: 2
      organizer: HDS-001
      participants: [HDS-001, HDS-002, HDS-005, HDS-011, HDS-014, HDS-017, HDS-019]
      agenda: >-
        End-of-day results review. Each lead: what your team finished today and what it delivered,
        what is left for tomorrow, and the one risk others should know about.
      place: meeting_room
      rule: everyone
    - id: standup
      day: 1
      tick: 1
      duration_ticks: 1
      organizer: HDS-001
      participants: [HDS-001, HDS-002, HDS-005, HDS-011, HDS-014, HDS-017, HDS-019]
      agenda: >-
        Morning stand-up. Each lead in one sentence: your team's plan for today and anything you
        need from another team.
      place: meeting_room
      rule: everyone
    - id: final_review
      day: 1
      tick: 26
      duration_ticks: 2
      organizer: HDS-001
      participants: [HDS-001, HDS-002, HDS-005, HDS-011, HDS-014, HDS-017, HDS-019]
      agenda: >-
        Release review. Each lead: what your team delivered, whether it is ready to ship, and what
        remains open.
      place: meeting_room
      rule: everyone
  interventions: []
  evaluation_season: false
  promotion_slots: 0
observable_outputs: [task_trajectory, assignments, meeting_utterances, sessions, stress, relations]
theory_tags: [temporary]
manipulation_check: [five tasks start unowned, four everyone-speaks meetings are scheduled]
