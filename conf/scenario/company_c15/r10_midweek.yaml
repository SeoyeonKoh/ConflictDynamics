# r10_human as one day of a project already under way (2026-10-09): Tuesday of week three,
# the release on Thursday 10:00. r10's day ran the whole project from nothing, so most people
# had nothing they could do (v6: 4.9 of 10 at a time; all work 70 ticks against ~280 of
# capacity). Here the early tasks are finished (their documents are the v6 run's), others are
# half done, every person has two routine tasks with no prerequisite, and four unowned tasks
# come in during the day for a lead or the manager to hand out. A standup replaces the kickoff;
# each person's backstory says how things stood this morning. Generated by a script from
# r10_human and runs/c16-real-r10-human-v6; edit freely.
