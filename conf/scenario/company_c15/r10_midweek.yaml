materials:
  T01: '경영진 지시(9/30): 스마트홈 앱에 ''에너지 인사이트'' 탭을 추가해 가구의 전기요금 절감을 돕는다. v1은 스마트플러그·스마트미터 연동 가구 대상.

    대상 규모: 연동 가구 42만, 그중 월간 활성 18만.

    사업 목표: 출시 3개월 안에 탭 주간 사용 가구 5만, 앱 주간 재방문률 22%→28%.

    일정: 2주 뒤 베타(1만 가구), 4주 뒤 앱 v5.2 정식 출시.'
  T02: '지난달 설문(응답 1,240가구): 68%가 ''어떤 기기가 전기를 많이 쓰는지 모른다'', 54%가 ''누진 구간 진입을 미리 알고 싶다''고 답함.

    심층 인터뷰 12가구: 월말 고지서를 보고서야 놀람; 그래프보다 ''이번 달 예상 요금'' 한 숫자를 원함; 알림이 하루 1회를 넘으면 끔.

    콜센터 문의 상위: 요금 계산 방식 31%, 기기 연결 끊김 24%.'
  T03: '데이터: 스마트미터 15분 단위 사용량(최대 2시간 지연), 스마트플러그 1분 단위 기기별 전력.

    요금: 주택용 저압 누진 3단계(경계 200kWh, 400kWh), 요금표는 외부 API로 월 1회 갱신.

    개인정보: 가구 사용량은 국내 리전에만 저장, 기기별 분석은 별도 동의 필요(현재 동의율 61%).'
  T04: '앱 하단 탭은 현재 4개(홈·기기·자동화·설정), 최대 5개까지 가능.

    디자인 시스템 v3 사용; 차트 컴포넌트는 막대·선 2종뿐.

    리서치에서 첫 화면 요청 1·2위: ''이번 달 예상 요금'', ''누진 구간까지 남은 kWh''.'
  T05: '사용량 데이터는 시계열 DB(보존 13개월, 하루 2억 건 적재)에 있으나 조회 API가 없다.

    데이터팀의 기존 월말 요금 예측 모델(평균 오차 ±8%)을 재사용할 수 있다.

    푸시 발송 플랫폼 한도 하루 500만 건, 현재 하루 310만 건 사용 중.'
  T06: '기존 공개 API 규칙: REST, /v2 접두어, 응답 p95 300ms 이내, 페이지당 최대 500건.

    클라이언트: 웹·iOS·Android 3종; 모바일은 오프라인일 때 마지막 응답을 캐시해 보여 준다.'
  T07: '백엔드 가용 인력: HDS-006 전담, HDS-008 50%.

    시계열 DB 조회는 한 번에 최대 31일 범위; 기기별 집계는 매시 정각 배치로 미리 계산하는 것을 권장.'
  T08: '앱 v5.2 코드 프리즈는 출시 5일 전; 웹은 따로 배포할 수 있다.

    지원 범위: iOS 15 이상, Android 9 이상, 웹은 크롬·사파리 최신 2개 버전.'
  T09: 'QA 인력 2명; 테스트 기기 랩 iOS 6대, Android 9대.

    기존 회귀 자동화 스위트 1,850건(통과율 97%, 실행 2시간).

    과거 장애 원인 1위는 누진 경계(199/200/201, 399/400/401kWh) 요금 계산 오류.'
  T10: '통합 빌드 40분, 스테이징 배포 15분.

    스테이징 데이터: 실제 가구 데이터를 익명화한 샘플 2,000가구.'
  T11: '출시 기준(품질팀 규정): 치명 결함 0건, 주요 결함 3건 이하, 회귀 통과율 98% 이상.

    베타 1만 가구는 단계적 오픈(1%→10%→100%).'
  T12: '시장출시팀이 없어 제품전략팀이 맡는다. 채널: 앱 내 배너, 푸시(수신 동의 26만 가구), 블로그·SNS; 보도자료는 경영진 승인 필요.

    고객센터: 출시 첫 주 문의가 평소보다 30% 늘 것으로 예상, 상담 스크립트 필요.

    런칭 마케팅 예산 1,500만 원.'
  T13: '결함 심각도: 치명(요금 오표기·데이터 노출), 주요(기능 사용 불가), 경미(표시 오류).

    출시 전 2일 동안 개발자 3명이 결함 수정에 투입 가능.'
  T14: '출시 결정 회의: 제품·개발·경험·품질 리드 참석, 결정권자 HDS-001.

    체크리스트: 품질 기준 충족, 고객센터 준비, 개인정보 검토 완료, 롤백 계획.'
  T15: '출시 창: 화요일 오전 10시(트래픽 최저), 롤백은 15분 안에 가능.

    출시 후 지표: 탭 진입률, 크래시율(0.3% 이하 유지), 요금 문의 건수.'
  P1-arch: '목적: 프리미엄 에너지 리포트 구독 결제. 월 예상 결제 3만 건.

    PG 후보 2곳: A사 수수료 2.9%·정산 D+2, B사 3.2%·정산 D+1. 카드정보 저장 금지(PG 토큰만).'
  P1-screens: 결제는 3단계 이내(상품 선택→결제수단→확인); 디자인 시스템 v3의 폼 컴포넌트 사용.
  P1-api: '필요 기능: 결제 요청·승인·취소·조회; PG 웹훅은 최대 5회 재시도된다.'
  P1-client: iOS의 디지털 구독은 앱스토어 인앱결제가 필수(수수료 15~30%); Android·웹은 PG 사용.
  P1-security: '점검 기준: OWASP API Top 10, 결제 위·변조 시나리오 12개.'
  P1-rollout: 사용자 1%부터 시작; 결제 실패율이 2%를 넘으면 중단한다.
  P3-audit: 현재 컴포넌트 142개 중 실제 사용 87개; 버튼 스타일 중복 9종.
  P3-tokens: 브랜드 색 5종 유지, 다크모드 지원 필요; 텍스트 대비 4.5:1 이상.
  P3-components: '우선 개편 대상: 버튼·입력·카드·탭·모달(사용 빈도 상위 5개).'
  P3-implement: 웹 클라이언트는 React 18; 컴포넌트 라이브러리는 별도 패키지로 배포.
  P3-usability: 사내 모집 참여자 8명 확보, 1인 40분.
  P3-docs: 사내 위키에 컴포넌트별 사용 예시와 금지 예시를 함께 싣는다.
  P4-plan: 현재 수동 회귀 테스트 420건, 출시마다 3일 소요; 목표 자동화율 70%.
  P4-env: '필요 환경: 테스트 서버 2대와 기기 팜 연결; 클라우드 예산 월 200만 원.'
  P4-suite: '우선 자동화 대상: 로그인·기기 연결·요금 화면 시나리오 120건.'
  P4-ci: PR마다 스모크 30건, 야간에 전체 실행.
  P4-flaky: 지난달 불안정 테스트 34건(실패율 5~20%).
  P4-report: '보고 지표: 자동화율, 실행 시간, 결함 검출 건수.'
  P12-plan: '목표: 프리미엄 구독 해지 이유 파악. 인터뷰 10명(해지자 6, 유지자 4).'
  P12-interviews: 7명 모집 완료, 사례비 1인 5만 원, 1회 45분 원격.
  P12-prototypes: '인터뷰에서 보여 줄 시안: 새 요금 안내 화면 2종.'
  P12-synthesis: '지난 분기 해지 설문(320명) 1위 이유: ''가격 대비 가치 부족''(41%).'
  P12-readout: '발표 대상: 제품·디자인·마케팅 리드, 30분.'
  R-weekly: 금요일 경영진 회의용 주간 보고. 출시 준비 현황, 위험, 다음 주 계획을 한 장으로. 급하지 않지만 오늘 안에 초안이 있으면 좋다.
  R-budget: 다음 분기 채용 요청 3건(백엔드 1, QA 1, 디자인 1)의 우선순위를 정해 인사팀에 회신. 이번 주 안에만 하면 된다.
  R-market: 경쟁 앱 3곳의 요금 예측·누진 알림 기능을 비교. 출시 후 포지셔닝 자료로 쓸 예정이라 급하지 않다.
  R-partner: 다음 주 스마트플러그 제조사와의 미팅 자료. 연동 가구 수 42만, 월간 활성 18만 기준.
  R-inquiry: 지난달 콜센터 문의 1,200건 중 요금 관련 문의를 유형별로 분류. 리서치 종합에 참고 자료로 쓴다.
  R-survey: 1,240가구 설문의 주관식 응답 정리. 급하지 않다.
  R-review: 팀원이 올린 알림 서비스 리팩터링 PR 리뷰. 변경 600줄 정도.
  R-oncall: 운영 대시보드와 알람 설정 점검. 이번 주 당번이 정태우다.
  R-postmortem: 지난주 목요일 사용량 조회 API 지연 장애(42분)의 원인과 재발 방지책 정리.
  R-logs: 느린 응답 상위 10개 엔드포인트 확인. 급하지 않다.
  R-deps: 보안 패치가 필요한 웹 의존성 7개 업데이트와 빌드 확인.
  R-a11y: 요금 화면의 스크린리더 라벨과 키보드 이동 점검.
  R-designreview: 어제 디자인 리뷰에서 나온 피드백 14건을 정리해 담당자별로 나눈다.
  R-guide: 새 차트 사용 규칙을 디자인 가이드에 반영. 급하지 않다.
  R-icons: 중복 아이콘 정리와 이름 규칙 통일. 디자인 시스템 개편과 별개로 틈틈이 하는 일.
  R-banner: 출시 알림용 앱 내 배너 시안 2종. 마케팅팀 요청, 이번 주 안.
  R-defects: v5.0, v5.1 릴리스의 결함 심각도별 통계와 재발 항목 정리.
  R-qaplan: 자동화 비율 목표에 맞춘 다음 분기 인력 계획 초안.
  R-regression: 지난 릴리스에서 바뀐 화면 기준으로 회귀 케이스 30여 건 갱신.
  R-testdata: 테스트 계정과 가구 데이터 정리. 급하지 않다.
  QA-nightly: '10시 반, 테스트 자동화 알림: 어젯밤 야간 자동화 테스트 120건 중 14건이 실패했다. 대부분 기기 연결 시나리오다. 실제 결함인지 불안정한 테스트인지
    오늘 안에 가려야 한다.'
  BUG-payment: '11시 반, 고객센터 최수진 매니저: 앱 v5.1에서 카드 결제 실패 문의가 지난 1시간 동안 37건 들어왔다. B카드에서만 재현된다는 제보가 있다. 원인
    파악과 임시 대응이 필요하다.'
  DS-darkmode: '12시 45분, 마케팅팀 요청: 다크모드에서 요금 카드 글자 대비가 낮아 읽기 어렵다는 앱스토어 리뷰가 여러 건 올라왔다. 출시 전에 대비를 맞춰 달라는
    요청이다.'
  EXEC-dashboard: '14시 15분, 최 상무 요청: 목요일 출시 직후 베타 지표를 볼 수 있는 대시보드 초안이 필요하다. 주간 사용 가구, 재방문률, 알림을 끈 비율을
    한 화면에.'
initial:
  T01:
    state: done
    summary: 대상, 제품 목적, 측정 가능한 사업 목표와 베타·정식 출시 일정을 후속 작업에 바로 쓸 수 있도록 정리했습니다. 주간 사용의 집계 기준은 명시 자료가 없어 1회
      이상 사용으로 가정했으며, 재방문률의 기존 산식은 유지합니다.
    document: '- 제품: 스마트플러그·스마트미터 연동 가구를 위한 스마트홈 앱 ‘에너지 인사이트’ 탭을 만든다. (대상 42만 가구, 월간 활성 18만 가구)

      - 목적: 가구의 전기요금 절감을 돕는다.

      - 출시 3개월 내 성공 기준: 탭 주간 사용 가구 5만.

      - 출시 성공 기준: 앱 주간 재방문률을 22%에서 28%로 높인다.

      - 베타: 2주 뒤 1만 가구 대상으로 진행한다. 정식 출시: 4주 뒤 앱 v5.2.

      - 측정 가정: ‘주간 사용 가구’는 해당 주에 탭을 1회 이상 사용한 연동 가구, ‘주간 재방문률’은 기존 정의를 유지한다.'
    approved_by: null
  T02:
    state: done
    summary: 설문·인터뷰·콜센터 자료를 요금 예측, 사전 알림, 계산 설명 및 연결 안정성 요구로 종합해 후속 요구사항에 바로 쓸 수 있게 했습니다. 알림 상한과 데이터·요금표
      표시 방식은 자료를 실행 가능한 기준으로 바꾼 설계 전제이며, 별도 검증은 남아 있습니다.
    document: '- 설문 응답 1,240가구 중 68%가 전력 소비가 큰 기기를 모르고, 54%가 누진 구간 진입을 미리 알고 싶어 함.

      - 인터뷰 12가구에서는 월말 고지서에서야 요금 부담을 인지했으며, 그래프보다 ‘이번 달 예상 요금’ 한 숫자를 선호함.

      - 핵심 기회: 예상 요금과 누진 구간 접근을 사전에 보여 주어 월말 요금 놀람을 줄인다.

      - 알림은 하루 최대 1회로 제한한다. 하루 1회를 넘으면 알림을 끈다는 인터뷰 결과를 기준으로 한 설계 전제임.

      - 콜센터 문의에서 요금 계산 방식이 31%, 기기 연결 끊김이 24%를 차지함. 예상 요금에는 계산 근거를 설명하고 연결 상태를 확인할 수 있어야 함.

      - 후속 요구사항 전제: 기기별 소비 분석은 연결 상태와 분석 동의가 확보된 범위에서 제공하고, 요금표 갱신·데이터 지연 시 예상치의 기준 시점을 명확히 표시한다.'
    approved_by: null
  T03:
    state: done
    summary: 제품 브리프의 사용·재방문 목표와 리서치 발견을 데이터 주기, 요금 예측·알림, 개인정보 조건에 연결해 측정 가능한 요구사항 8개로 정리했습니다(T01, T02,
      T03 자료). 예상 요금 열람률, 안내율, 표시율 등 제품 내 지표의 구체적 산식은 가용 자료에 없어 후속 계측 정의가 필요합니다.
    document: 'R1: 출시 3개월 내 에너지 인사이트 탭을 주간 사용한 연동 가구를 5만 가구 이상 달성한다. - 측정 지표: 주간 1회 이상 탭을 사용한 연동 가구 수
      (T01)

      R2: 출시 성공 기준으로 앱 주간 재방문률을 22%에서 28%로 높인다. - 측정 지표: 기존 정의에 따른 주간 재방문률 (T01)

      R3: 사용자가 월말 요금 부담을 사전에 파악하도록 이번 달 예상 요금을 제공하고 계산 근거를 설명한다. - 측정 지표: 예상 요금 표시 가구 비율 및 계산 근거 열람률 (T02)

      R4: 누진 구간 접근을 사전에 안내하되 알림은 하루 최대 1회로 제한한다. - 측정 지표: 알림 발송 가구의 일별 발송 횟수(최대 1회) 및 누진 구간 사전 안내율 (T02)

      R5: 예상 요금에 데이터 기준 시점과 요금표 갱신 시점을 표시하며, 요금표는 외부 API에서 월 1회 갱신한다. - 측정 지표: 기준 시점 표시율 및 월간 요금표 갱신 성공률
      (T02; 요금표 조건: T03 자료)

      R6: 스마트미터 사용량은 15분 단위 데이터를 반영하고, 데이터 지연 시 최신 데이터 기준 시점을 명확히 표시한다. - 측정 지표: 사용량 반영 주기 준수율 및 지연 표시율
      (T03 자료; T02)

      R7: 기기별 소비 분석은 별도 동의와 연결 상태가 확보된 경우에만 제공하고, 가구 사용량은 국내 리전에 저장한다. - 측정 지표: 동의·연결 확인 후 분석 제공 비율 및
      국내 리전 저장 준수율 (T03 자료; T02)

      R8: 스마트플러그 기기별 전력 데이터는 1분 단위로 분석에 반영한다. - 측정 지표: 기기별 데이터 반영 주기 준수율 (T03 자료)'
    approved_by: HDS-002
  T05:
    state: done
    summary: 기존 데이터·예측·푸시 제약을 기준으로 구현 경로와 핵심 출시 위험을 구체화했습니다(T03, R3–R8). 조회 API 성능 목표와 모델 재검증 기준은 근거 자료가
      없어 후속 설계에서 가정으로 확정해야 합니다.
    document: '1. 사용량 조회 API가 없어 주간 인사이트 조회 경로는 신규 구축이 필요하다(T03).

      2. 시계열 DB의 13개월 보존·일 2억 건 적재를 전제로, 국내 리전 내 집계 조회 API를 설계하고 원시 데이터 직접 조회는 피한다(T03).

      3. 스마트미터는 15분, 스마트플러그는 1분 데이터 반영을 목표로 하며, 지연 시 기준 시점을 응답에 포함한다(T03, R6, R8).

      4. 월말 요금 예측은 기존 모델(평균 오차 ±8%) 재사용을 기술적으로 우선 검토하고, 화면에 예측 기준과 계산 근거를 제공한다(T03, R3, R5).

      5. 푸시는 하루 500만 건 한도 중 310만 건 사용으로 여유 190만 건뿐이다. 누진 안내 하루 1회 제한은 가구 단위 중복 방지와 발송량 상한으로 보장한다(T03,
      R4).

      6. 결론: 구현은 가능하나 조회 API 신규 개발과 푸시 용량 관리가 출시 핵심 위험이다. 집계 방식·응답 지연 목표·예측 모델 검증 기준은 자료에 없어 후속 설계 가정으로
      확정해야 한다.'
    approved_by: HDS-001
  P3-audit:
    state: done
    summary: 컴포넌트 사용 현황과 버튼 스타일 중복을 정리해 개편 작업의 기준을 제시했습니다. 미사용 컴포넌트의 삭제 여부와 버튼 통합 규칙은 세부 검증이 남아 있습니다.
    document: '점검 기준: 현재 컴포넌트 142개 중 실제 사용 중인 87개를 사용 대상으로 기록한다.

      미사용 컴포넌트 55개는 현행 사용 범위에서 제외하고, 삭제 여부는 별도 검증 전까지 확정하지 않는다.

      버튼 스타일 중복 9종을 통합 후보로 표시한다.

      후속 개편은 9종의 차이를 대조해 기준 스타일과 예외 사용처를 정한 뒤 적용한다.

      가정: 실제 사용 여부와 버튼 중복은 제공된 현황 수치를 기준으로 판단한다.'
    approved_by: HDS-011
  P4-plan:
    state: done
    summary: 420건 중 294건 자동화 목표와 P0/P1/P2 후보 선정·실행 순서, 기록·실패 분류 및 출시 회귀 운영 기준을 구체화했습니다. 입력에 테스트별 ID와 기능
      영역 목록이 없어 실제 후보 배정은 목록 확보 후 확정해야 합니다.
    document: '- 목표: 수동 회귀 420건 중 294건(70%) 자동화; 출시 회귀 3일 소요를 줄이되 전체 범위 판정은 유지한다. (P4-plan)

      - 우선순위 P0: 핵심 사용자 흐름 및 출시 차단·고위험 회귀 테스트를 자동화한다. 기능별 후보 목록이 제공되지 않아, 각 기능 영역의 대표 정상 흐름과 주요 실패 흐름을
      후보로 삼는 것은 계획상 가정이다.

      - 우선순위 P1: 반복 실행 빈도가 높거나 과거 회귀가 잦은 기능 테스트를 자동화한다. 이력 자료가 없으므로 실행 빈도와 위험도를 기준으로 정렬한다는 가정이다.

      - 우선순위 P2: 저빈도·저위험 테스트를 자동화해 누적 294건을 채우고, 나머지는 수동 회귀로 유지한다. 구체 테스트 ID·기능 영역은 목록 확보 후 이 순서에 배정한다.

      - 실행 순서: P0 후보 → P1 후보 → P2 후보; 각 영역에서 자동화 환경·데이터 의존성을 먼저 확인하고, 실행 가능한 테스트부터 구현한다. (순서 기준은 가정)

      - 테스트별 기록: 고유 ID/기능 영역, 우선순위, 실행 결과·시간, 빌드/환경, 실패 재현 절차 및 증거를 남긴다. (기록 기준은 가정)

      - 실패는 제품 결함·테스트 불안정·환경 문제로 분류한다. 불안정 항목은 재현 근거와 원인을 기록해 안정화한 뒤 회귀 게이트에 포함한다. (분류·운영 기준은 가정)

      - 출시 시 자동화 회귀를 우선 실행하고 미자동화 항목은 수동 수행해 420건 전체를 판정한다; 후보별 ID와 실제 영역 배정은 테스트 목록 확보 시 확정한다. (운영 기준은
      가정)'
    approved_by: HDS-014
  P4-env:
    state: done
    summary: 두 테스트 서버와 기기 팜을 월 200만 원 예산 안에서 함께 쓰는 환경 구성 및 실행 전 연결 확인·기록 기준을 정했습니다. 실제 연결 검증 결과와 테스트별
      배정은 환경 접속 및 테스트 목록 확보 후 남깁니다.
    document: '테스트 서버 2대 구성과 기기 팜 연결을 포함한 자동화 테스트 환경을 월 200만 원 클라우드 예산 범위로 정했다. (P4-env materials)

      환경은 테스트 실행 시 서버 2대와 기기 팜을 함께 사용할 수 있도록 구성한다. (구성 방식은 가정)

      실행 전 서버 2대의 접속 여부와 기기 팜 연결 상태를 확인하고, 결과를 환경 정보와 함께 기록한다. (검증·기록 절차는 가정)

      자동화는 P4-plan의 P0→P1→P2 순서로 실행하며, 환경이 준비된 테스트부터 착수한다. (P4-plan)

      출시 회귀는 자동화 대상과 미자동화 항목을 함께 판정해 전체 420건 범위를 유지한다. (P4-plan)'
    approved_by: HDS-014
  P12-plan:
    state: done
    summary: 해지자 6명과 유지자 4명을 대상으로 한 인터뷰 구성과 공통·집단별 질문 축을 정해 후속 모집과 인터뷰에 바로 활용할 수 있게 했다. 모집 일정과 ‘최근’의 기준은
      입력에 없어 가정으로 표시했다.
    document: '- 목표: 프리미엄 구독 해지 이유를 파악한다.

      - 인터뷰 표본: 총 10명—해지자 6명, 유지자 4명.

      - 해지자에게 해지 계기, 결정 과정, 가장 큰 불만·미충족 기대를 묻는다.

      - 유지자에게 계속 구독하는 이유, 체감 가치, 해지를 고민한 경험을 묻는다.

      - 두 집단 모두 가격·콘텐츠/기능 가치·사용 경험·대안 이용을 공통 질문 축으로 확인한다.

      - 인터뷰 답변은 구체적 사례와 해지/유지 결정에 미친 영향을 기록한다.

      - 가정: 별도 일정·모집 기준이 주어지지 않아, 대상자는 최근 해지자와 현재 유지자 중 인터뷰 참여 가능한 고객으로 모집한다.'
