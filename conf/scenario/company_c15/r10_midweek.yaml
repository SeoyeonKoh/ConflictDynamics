backstory:
  HDS-001:
  - 에너지 인사이트 탭 출시는 이번 주 목요일 오전 10시다. 지금은 프로젝트 3주차 화요일이다.
  - 지난주 킥오프에서 팀별 담당을 정했고, 어제 정태우의 기술 타당성 검토를 승인했다.
  - 고객 인터뷰 계획은 지난주에 네가 마무리했다. 출시 준비 검토와 출시 결정은 네 몫이다.
  HDS-002:
  - 제품 브리프는 지난주에 끝냈고, 이도윤의 요구사항 명세를 어제 승인했다.
  - 출시 계획을 어제 오후부터 이도윤과 쓰기 시작해 절반쯤 했다.
  - 고객 인터뷰를 어제 시작해 두 가구를 마쳤다.
  HDS-003:
  - 요구사항 명세를 지난주에 써서 어제 박소연에게 승인받았다.
  - 박소연과 출시 계획을 같이 쓰고 있다. 인터뷰가 끝나면 결과 종합을 맡는다.
  HDS-005:
  - 어제 기술 타당성 검토를 끝내 김민재에게 승인받았다.
  - 결제 아키텍처 설계를 어제 시작했다. 팀의 윤지호가 API 계약을 쓰고 있다.
  - 이번 주 운영 당번이다.
  HDS-006:
  - API 계약을 어제 오후에 시작해 절반쯤 썼다. 끝나면 백엔드 구현이 바로 이어진다.
  - 지난주 사용량 조회 API 지연 장애의 회고 문서를 아직 못 썼다.
  HDS-008:
  - 테스트 환경 구축을 지난주에 끝냈다.
  - 웹·모바일 구현은 UX 흐름과 API 계약이 나와야 시작할 수 있다.
  HDS-011:
  - 문지안이 맡은 UX 흐름과 디자인을 같이 하고 있고, 절반쯤 됐다.
  - 디자인 토큰 정의를 어제 시작했다. 문지안의 디자인 시스템 점검 결과를 바탕으로 한다.
  - 인터뷰용 프로토타입은 인터뷰 계획이 나와 있어 시작할 수 있다.
  HDS-013:
  - 디자인 시스템 점검을 지난주에 끝내 송아린에게 승인받았고, 사용자 리서치 종합도 지난주에 끝냈다.
  - UX 흐름과 디자인을 송아린과 하고 있고, 절반쯤 됐다.
  HDS-014:
  - 테스트 전략은 요구사항 명세와 기술 검토가 끝나서 이제 쓸 수 있다. 조은별과 같이 한다.
  - 자동화 테스트 스위트를 어제 시작했다.
  HDS-015:
  - 테스트 자동화 계획을 지난주에 끝냈다. 서동현과 테스트 전략을 같이 쓴다.
  - 품질 검증은 통합 후보 빌드가 나와야 시작할 수 있다.
