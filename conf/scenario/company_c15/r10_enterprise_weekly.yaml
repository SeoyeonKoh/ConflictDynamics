initial:
  T01:
    state: done
    worked: 0
    summary: 대상, 제품 목적, 측정 가능한 사업 목표와 베타·정식 출시 일정을 후속 작업에 바로 쓸 수 있도록 정리했습니다. 주간 사용의 집계 기준은 명시 자료가 없어 1회
      이상 사용으로 가정했으며, 재방문률의 기존 산식은 유지합니다.
    document: '- 제품: 스마트플러그·스마트미터 연동 가구를 위한 스마트홈 앱 ‘에너지 인사이트’ 탭을 만든다. (대상 42만 가구, 월간 활성 18만 가구)

      - 목적: 가구의 전기요금 절감을 돕는다.

      - 출시 3개월 내 성공 기준: 탭 주간 사용 가구 5만.

      - 출시 성공 기준: 앱 주간 재방문률을 22%에서 28%로 높인다.

      - 베타: 2주 뒤 1만 가구 대상으로 진행한다. 정식 출시: 4주 뒤 앱 v5.2.

      - 측정 가정: ‘주간 사용 가구’는 해당 주에 탭을 1회 이상 사용한 연동 가구, ‘주간 재방문률’은 기존 정의를 유지한다.'
  T02:
    state: done
    worked: 0
    summary: 설문·인터뷰·콜센터 자료를 요금 예측, 사전 알림, 계산 설명 및 연결 안정성 요구로 종합해 후속 요구사항에 바로 쓸 수 있게 했습니다. 알림 상한과 데이터·요금표
      표시 방식은 자료를 실행 가능한 기준으로 바꾼 설계 전제이며, 별도 검증은 남아 있습니다.
    document: '- 설문 응답 1,240가구 중 68%가 전력 소비가 큰 기기를 모르고, 54%가 누진 구간 진입을 미리 알고 싶어 함.

      - 인터뷰 12가구에서는 월말 고지서에서야 요금 부담을 인지했으며, 그래프보다 ‘이번 달 예상 요금’ 한 숫자를 선호함.

      - 핵심 기회: 예상 요금과 누진 구간 접근을 사전에 보여 주어 월말 요금 놀람을 줄인다.

      - 알림은 하루 최대 1회로 제한한다. 하루 1회를 넘으면 알림을 끈다는 인터뷰 결과를 기준으로 한 설계 전제임.

      - 콜센터 문의에서 요금 계산 방식이 31%, 기기 연결 끊김이 24%를 차지함. 예상 요금에는 계산 근거를 설명하고 연결 상태를 확인할 수 있어야 함.

      - 후속 요구사항 전제: 기기별 소비 분석은 연결 상태와 분석 동의가 확보된 범위에서 제공하고, 요금표 갱신·데이터 지연 시 예상치의 기준 시점을 명확히 표시한다.'
  T03:
    state: done
    worked: 0
    summary: 제품 브리프의 사용·재방문 목표와 리서치 발견을 데이터 주기, 요금 예측·알림, 개인정보 조건에 연결해 측정 가능한 요구사항 8개로 정리했습니다(T01, T02,
      T03 자료). 예상 요금 열람률, 안내율, 표시율 등 제품 내 지표의 구체적 산식은 가용 자료에 없어 후속 계측 정의가 필요합니다.
    document: 'R1: 출시 3개월 내 에너지 인사이트 탭을 주간 사용한 연동 가구를 5만 가구 이상 달성한다. - 측정 지표: 주간 1회 이상 탭을 사용한 연동 가구 수
      (T01)

      R2: 출시 성공 기준으로 앱 주간 재방문률을 22%에서 28%로 높인다. - 측정 지표: 기존 정의에 따른 주간 재방문률 (T01)

      R3: 사용자가 월말 요금 부담을 사전에 파악하도록 이번 달 예상 요금을 제공하고 계산 근거를 설명한다. - 측정 지표: 예상 요금 표시 가구 비율 및 계산 근거 열람률 (T02)

      R4: 누진 구간 접근을 사전에 안내하되 알림은 하루 최대 1회로 제한한다. - 측정 지표: 알림 발송 가구의 일별 발송 횟수(최대 1회) 및 누진 구간 사전 안내율 (T02)

      R5: 예상 요금에 데이터 기준 시점과 요금표 갱신 시점을 표시하며, 요금표는 외부 API에서 월 1회 갱신한다. - 측정 지표: 기준 시점 표시율 및 월간 요금표 갱신 성공률
      (T02; 요금표 조건: T03 자료)

      R6: 스마트미터 사용량은 15분 단위 데이터를 반영하고, 데이터 지연 시 최신 데이터 기준 시점을 명확히 표시한다. - 측정 지표: 사용량 반영 주기 준수율 및 지연 표시율
      (T03 자료; T02)

      R7: 기기별 소비 분석은 별도 동의와 연결 상태가 확보된 경우에만 제공하고, 가구 사용량은 국내 리전에 저장한다. - 측정 지표: 동의·연결 확인 후 분석 제공 비율 및
      국내 리전 저장 준수율 (T03 자료; T02)

      R8: 스마트플러그 기기별 전력 데이터는 1분 단위로 분석에 반영한다. - 측정 지표: 기기별 데이터 반영 주기 준수율 (T03 자료)'
    approved_by: HDS-002
  T04:
    state: in_progress
    worked: 1.0
  T05:
    state: done
    worked: 0
    summary: 기존 데이터·예측·푸시 제약을 기준으로 구현 경로와 핵심 출시 위험을 구체화했습니다(T03, R3–R8). 조회 API 성능 목표와 모델 재검증 기준은 근거 자료가
      없어 후속 설계에서 가정으로 확정해야 합니다.
    document: '1. 사용량 조회 API가 없어 주간 인사이트 조회 경로는 신규 구축이 필요하다(T03).

      2. 시계열 DB의 13개월 보존·일 2억 건 적재를 전제로, 국내 리전 내 집계 조회 API를 설계하고 원시 데이터 직접 조회는 피한다(T03).

      3. 스마트미터는 15분, 스마트플러그는 1분 데이터 반영을 목표로 하며, 지연 시 기준 시점을 응답에 포함한다(T03, R6, R8).

      4. 월말 요금 예측은 기존 모델(평균 오차 ±8%) 재사용을 기술적으로 우선 검토하고, 화면에 예측 기준과 계산 근거를 제공한다(T03, R3, R5).

      5. 푸시는 하루 500만 건 한도 중 310만 건 사용으로 여유 190만 건뿐이다. 누진 안내 하루 1회 제한은 가구 단위 중복 방지와 발송량 상한으로 보장한다(T03,
      R4).

      6. 결론: 구현은 가능하나 조회 API 신규 개발과 푸시 용량 관리가 출시 핵심 위험이다. 집계 방식·응답 지연 목표·예측 모델 검증 기준은 자료에 없어 후속 설계 가정으로
      확정해야 한다.'
