weekly_operations:
  lunch_start_tick: 16
  max_breakers: 3
  norms: '이 조직은 대기업의 일부 직원 10명이다. 평일 09–18시, 13–14시 점심이다. 매일 스탠드업은 20분, 이동·대기를 합쳐 30분 예약이다. 금요일 주간회의 60분에는
    김민재와 기능 리드, 안건 담당자가 참석하여 주간보고에 근거해 방향과 주요 결정을 정한다. 월요일 김민재는 외부 경영진에게 60분 보고하고 돌아와 30분간 관련 리드에게 공유한다.
    준비 자료는 며칠 동안 수합하고 마지막 30분에 마무리한다.

    김민재는 배정·결정·결재·중요 문서 검토·도움·외부 대표 역할을 맡는다. 리드는 검토/문제 해결/지원과 WBS/일정/배정/협의를 대략 5:5로 수행한다. 이 비율은 개발 업무
    50%를 뜻하지 않는다. 실무자는 실행과 회의/연락/지원이 대략 8:2이며 강제 할당량은 아니다. 중요한 작업이나 문제 수습은 리드가 함께 검토한다.

    리드가 WBS와 마감을 관리한다. 전 단계 승인을 받은 뒤 다음 단계에 착수하고 중간 및 마무리 보고를 한다. 최종화 전 정확성과 형식을 검토한다. 개발·디자인·리서치는 반나절
    이상, 실패 분석은 약 60분, 장기 계획은 여러 날과 회의를 거쳐 진행한다. 하루에 모든 작업을 끝낼 필요는 없다. 회의록은 회의별 지정 담당자 한 명만 작성하고 놓치지 않는다.

    막히면 리드에게 질문한다. 답을 기다리는 동안 자기 다른 일, 보고 자료, 코드 정리, 발표/회의 준비, WBS 점검을 한다. 준비는 휴식이 아니다. 아무 일도 없거나 스트레스가
    높으면 자율적으로 쉰다. 다른 팀이나 리드를 따라 쉴 수 있으나 동시에 최대 3명이다.

    진행 확인은 반 근무일(4시간) 기다린 뒤 한 번 리마인드하고 다시 반 근무일 기다린다. 하루 무응답이면 자기 리드에게 보고해 상대 리드와 연락하도록 한다. 밤과 점심은 대기
    시간에서 제외한다. 팀 내 도움은 쉽게, 타 팀 도움은 그 업무의 맥락과 전문성이 맞을 때만 한다. 정식 협업은 양측 리드가 합의하고, 긴급 도움은 사전·사후 보고하되 사정에
    따라 거절할 수 있다. 소통 담당자는 새로 임명하지 않는다.

    경영진 방향 변경은 결정 공유 후 관련 리드가 WBS에 반영·전달한다. 금요일 수정 WBS 진행을 공유하고 다음 월요일 경영진에게 이행을 보고한다. 평소 약간의 여유를 두고 변경
    구간에서 바빠진다.'
