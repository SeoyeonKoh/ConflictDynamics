[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conflict-sim"
version = "0.1.0"
description = "Small Wikipedia talk-page conflict simulations"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2,<1.4",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
llm = [
    "openai>=1.60,<3",
    "python-dotenv>=1,<2",
]
dashboard = ["streamlit>=1.63,<2"]
score = [
    # 4.x eagerly imports unsloth (NVIDIA/Intel GPUs only) and cannot load CRAFT here.
    "convokit>=3,<4",
    "torch>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
conflict-sim = "conflict_sim.cli:main"
conflict-score = "conflict_sim.score:main"
conflict-seeds = "conflict_sim.cga:main"

[tool.hatch.build]
exclude = [".env", ".env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/conflict_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["craft: optional integration check using real, locally cached CRAFT weights"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
