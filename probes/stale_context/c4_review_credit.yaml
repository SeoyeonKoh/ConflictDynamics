name: 하루 리뷰에서 남이 한 일 (다크모드 글자 대비 수정)
base: {scenario: r10_midweek, warmup: 2}
agent: HDS-008
tick: 33
call: review
world:
  tasks:
    T04: {lifecycle: done, worked: 2, done_tick: 12}
    T06: {lifecycle: done, worked: 2, done_tick: 13}
    DS-darkmode: {owner: HDS-008, assigned: [HDS-011], lifecycle: done, worked: 2, worked_by: {HDS-011: 2}, done_tick: 18}
    R-a11y: {lifecycle: done, worked: 3, worked_by: {HDS-008: 3}, done_tick: 6}
context:
  place: office
  memories:
    - {text: "'웹 접근성 점검' 일을 했다. 집중실도 꽉 찼네, 자리에서 접근성 점검부터 마무리하자.", importance: 6, valence: 0.2}
expect:
  # one insight (split by " / ") that credits the dark-mode fix to me: done, and 송아린 unnamed
  - {field: reflection, not_matches: "(?s)^(?!.*(아린|HDS-011)).*(다크모드[^/]*(끝냈|마쳤|완료)|(끝냈|마쳤|완료)[^/]*다크모드)"}
repeat: 5
