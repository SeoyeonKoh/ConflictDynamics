# lead) then took T06 api contract, "among what is left". Does it, as a rule?
name: E4-E2 시장출시 리드, 남은 것 중에서 (실제 순서)
base: {scenario: p0_documents_ko, warmup: 1}
agent: HDS-017
tick: 2
call: speak
