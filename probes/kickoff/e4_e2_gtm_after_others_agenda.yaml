    - {speaker: HDS-011, text: "제품경험팀은 T04 UX 흐름과 디자인을 맡고, 제가 책임지겠습니다."}
    - {speaker: HDS-014, text: "QA는 T09 테스트 전략을 맡고 제가 책임지겠습니다. API 계약 담당자도 지정해 주세요."}
