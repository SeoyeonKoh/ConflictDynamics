<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConflictDynamics Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f0ec; --ink:#111110; --muted:#86837b; --line:rgba(17,17,16,.09);
  --card:#fcfbf8; --accent:#ff4f1f; --ok:#11a37f; --bad:#e5383b;
  --navy:#0f1638; --navy2:#1c2660; --gold:#e9bd62;
  --page:#e4e2dc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--page);overflow:hidden}
body{font-family:'Inter Tight','Noto Sans KR',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#wrap{position:absolute;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;background:var(--bg);overflow:hidden;transform-origin:0 0;border-radius:6px;box-shadow:0 30px 80px -30px rgba(0,0,0,.35)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.abs{position:absolute}
.card{background:var(--card);border-radius:18px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 24px 50px -24px rgba(40,30,15,.28)}
.mono{font-family:'JetBrains Mono',monospace}
.kr{font-family:'Noto Sans KR','Inter Tight',sans-serif}
.av{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:0 0 0 3px #fff,0 6px 14px -4px rgba(0,0,0,.35)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#ecebe6;color:#55524b}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:3px;background:#e7e5df;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
/* caption */
#cap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:999px;background:rgba(17,17,16,.92);color:#fff;font-size:16px;font-weight:500;white-space:nowrap;z-index:50;font-family:'Noto Sans KR',sans-serif;backdrop-filter:blur(6px)}
#cap b{font-family:'JetBrains Mono',monospace;font-size:11px;background:#fff;color:#111;border-radius:999px;padding:4px 9px;font-weight:700}
#cap.dark{background:rgba(255,255,255,.94);color:#111}
#cap.dark b{background:#111;color:#fff}
#chapter{position:absolute;left:28px;top:22px;z-index:50;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);font-family:'JetBrains Mono',monospace}
#cursor{position:absolute;left:0;top:0;z-index:60;pointer-events:none;width:26px;height:26px}
#ripple{position:absolute;z-index:59;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
/* controls */
#ctl{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#55524b}
#ctl button{border:0;background:#111;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
#ctl button.ghost{background:transparent;color:#111;border:1px solid rgba(0,0,0,.15)}
#track{flex:1;height:22px;position:relative;cursor:pointer}
#track .rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:rgba(0,0,0,.12)}
#track .fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:#111}
#track .mk{position:absolute;top:5px;width:2px;height:12px;background:rgba(0,0,0,.25)}
#track .knob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#111;box-shadow:0 0 0 3px var(--page)}
#time{min-width:92px;text-align:right}
#chap{min-width:150px;font-family:'Noto Sans KR',sans-serif;font-weight:500}
@media (max-width:600px){#chap{display:none}#ctl{gap:8px;padding:0 10px}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="chapter"></div>
  <div id="cap"><b>00</b><span></span></div>
  <div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 26 26"><path d="M4 2 L4 21 L9 16.5 L12.5 24 L15.5 22.6 L12 15.3 L18.5 15.3 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div></div>
<div id="ctl">
  <button id="play" title="재생/일시정지 (Space)">❚❚</button>
  <button id="restart" class="ghost" title="처음부터">↺</button>
  <div id="track"><div class="rail"></div><div class="fill"></div><div class="knob"></div></div>
  <div id="time">0:00 / 0:00</div>
  <div id="chap"></div>
</div>
<script>
/* ============ helpers ============ */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  lin:t=>t,
  out:t=>1-Math.pow(1-t,3),
  in:t=>t*t*t,
  io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
};
const P=(t,a,b,e=E.out)=>e(clamp((t-a)/(b-a)));
function kf(t,fr,e=E.io){ // [[t,v],...]
  if(t<=fr[0][0])return fr[0][1];
  for(let i=1;i<fr.length;i++){if(t<=fr[i][0]){const[a,va]=fr[i-1],[b,vb]=fr[i];return lerp(va,vb,e((t-a)/(b-a)))}}
  return fr[fr.length-1][1];
}
function st(el,{o,x=0,y=0,s=1,r=0}={}){ if(o!==undefined)el.style.opacity=o; el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; }
function pop(el,t,at,d=.55,dy=18){const k=P(t,at,at+d);st(el,{o:k,y:(1-k)*dy});return k}
function popS(el,t,at,d=.5){const k=P(t,at,at+d,E.back);el.style.opacity=clamp((t-at)/(d*.5));st(el,{s:lerp(.6,1,k)});el.style.opacity=clamp((t-at)/(d*.5));return k}
function typed(el,txt,t,a,b){const n=Math.round(txt.length*clamp((t-a)/(b-a)));el.textContent=txt.slice(0,n);}
const stage=document.getElementById('stage');
function mk(parent,html){const d=document.createElement('div');d.innerHTML=html.trim();const el=d.firstElementChild;parent.appendChild(el);return el}

const AG={
  Erin:{d:'D',r:'Engineering manager',c:'#ff5a36',dept:'dev'},
  Alex:{d:'C',r:'Backend engineer',c:'#3b6cf6',dept:'dev'},
  Blake:{d:'D',r:'Backend engineer',c:'#11a37f',dept:'dev'},
  Casey:{d:'S',r:'Product designer',c:'#b54ad8',dept:'product'},
  Drew:{d:'C',r:'Test engineer',c:'#e39b0c',dept:'dev'},
  Frankie:{d:'I',r:'Product marketer',c:'#e0457b',dept:'product'},
};
const NAMES=Object.keys(AG);
const av=(n,sz=36,extra='')=>`<div class="av ${extra}" style="width:${sz}px;height:${sz}px;background:${AG[n].c};font-size:${Math.round(sz*.42)}px">${n[0]}</div>`;

/* ============ scenes ============ */
const SCENES=[];
function scene(title,dur,opts,build){SCENES.push({title,dur,...opts,build})}

/* 01 — Intro */
scene('인트로',6.5,{caps:[[0,'LLM 에이전트 여섯 명이 작은 회사에서 하루를 보냅니다.']],cursor:[[0,1180,700],[2.2,820,520],[4,760,470],[6.5,760,470]]},root=>{
  const dot=mk(root,`<div class="abs" style="left:640px;top:330px;width:24px;height:24px;margin-left:-12px;border-radius:999px;background:#111;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;overflow:hidden;white-space:nowrap" class="mono"></div>`);
  const pillTxt='6 agents · 1 day · 32 ticks';
  const title=mk(root,`<div class="abs" style="left:0;right:0;top:250px;text-align:center;font-weight:900;font-size:104px;letter-spacing:-.045em">ConflictDynamics<span style="color:var(--accent)">.</span></div>`);
  const sub=mk(root,`<div class="abs kr" style="left:0;right:0;top:390px;text-align:center;font-size:20px;color:#55524b;font-weight:500">일하고 · 말하고 · 기억하고 · 서로를 평가하는 회사 시뮬레이터</div>`);
  const avs=NAMES.map((n,i)=>mk(root,`<div class="abs" style="left:${640-6*28+i*56}px;top:470px">${av(n,40)}</div>`));
  return t=>{
    const s=P(t,0,.5,E.back), w=kf(t,[[0,24],[.9,24],[1.7,330],[2.9,330],[3.4,24]]), h=kf(t,[[0,24],[.9,24],[1.7,70],[2.9,70],[3.4,24]]);
    dot.style.width=w+'px';dot.style.height=h+'px';dot.style.marginLeft=-w/2+'px';dot.style.top=(342-h/2)+'px';
    dot.textContent=t>1.5&&t<3?pillTxt:'';
    dot.style.fontSize='18px';
    st(dot,{o:t<3.6?1:1-P(t,3.4,3.7),s:s*(t>3.3?lerp(1,0,P(t,3.3,3.7)):1)});
    const k=P(t,3.5,4.3);st(title,{o:k,y:(1-k)*30,s:lerp(.96,1,k)});
    pop(sub,t,4.1);
    avs.forEach((a,i)=>popS(a,t,4.5+i*.12));
  };
});

/* 02 — Office */
scene('사무실',11,{caps:[[0,'사무실은 장소 그래프 — 일은 office, 식사는 pantry·cafeteria에서.'],[5.2,'하루 = 15분 단위 32틱. 회의실(정원 4)은 유일한 희소 자원입니다.']],cursor:[[0,760,470],[2,1080,160],[6.6,965,150],[7,965,150,1],[11,965,150]]},root=>{
  const card=mk(root,`<div class="abs card" style="left:140px;top:62px;width:1000px;height:560px;overflow:hidden">
    <div style="height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 16px">
      <i style="width:11px;height:11px;border-radius:50%;background:#ff5f57"></i><i style="width:11px;height:11px;border-radius:50%;background:#febc2e"></i><i style="width:11px;height:11px;border-radius:50%;background:#28c840"></i>
      <span class="mono" style="margin-left:14px;font-size:12px;color:var(--muted);background:#efede8;padding:4px 12px;border-radius:7px">localhost:5173 · Phaser viewer</span>
      <span class="mono clock" style="margin-left:auto;font-size:13px;font-weight:700"></span>
    </div>
    <div class="floor abs" style="left:0;top:42px;right:0;bottom:0"></div>
  </div>`);
  const floor=card.querySelector('.floor'), clock=card.querySelector('.clock');
  const rooms=[
    ['dev-office','office · 일하는 곳',24,22,540,260,'#eef3ff'],
    ['meeting-room','meeting_room · 정원 4',584,22,392,260,'#fff3ec'],
    ['lobby','lobby · 출근/퇴근',24,302,250,190,'#f3f2ee'],
    ['pantry','pantry · 음식',294,302,270,190,'#effaf4'],
    ['cafeteria','cafeteria · 음식',584,302,392,190,'#effaf4'],
  ];
  const R={};
  rooms.forEach(([id,k,x,y,w,h,c],i)=>{R[id]={x,y,w,h};R[id].el=mk(floor,`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;background:${c};border:1.5px solid rgba(0,0,0,.07)">
      <div style="padding:12px 14px"><div class="mono" style="font-weight:700;font-size:14px">${id}</div><div class="kr" style="font-size:12px;color:var(--muted);margin-top:2px">${k}</div></div></div>`)});
  for(let i=0;i<6;i++){mk(R['dev-office'].el,`<div class="abs" style="left:${40+(i%3)*165}px;top:${110+Math.floor(i/3)*80}px;width:96px;height:34px;border-radius:6px;background:#dfe6f7"></div>`)}
  mk(R['meeting-room'].el,`<div class="abs" style="left:96px;top:96px;width:200px;height:110px;border-radius:55px;background:#f6dccb"></div>`);
  const full=mk(R['meeting-room'].el,`<div class="abs chip" style="right:12px;top:12px;background:#111;color:#fff">3 / 4</div>`);
  const lobby=(i)=>[54+(i%3)*70,370+Math.floor(i/3)*60];
  const desk=(i)=>[70+(i%3)*165,118+Math.floor(i/3)*78];
  const meet=[[700,128],[790,118],[880,128]];
  const els=NAMES.map((n,i)=>{const e=mk(floor,`<div class="abs" style="left:0;top:0">${av(n,38)}<div class="mono" style="position:absolute;top:42px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap">${n}</div></div>`);return e});
  const phases=mk(card,`<div class="abs" style="left:0;right:0;bottom:0;height:0"></div>`);
  return t=>{
    pop(card,t,0,.6,24);
    const tick=Math.floor(kf(t,[[0,0],[2.4,0],[5,4],[8,9],[11,12]],E.lin));
    const mins=9*60+tick*15, hh=String(Math.floor(mins/60)).padStart(2,'0'), mm=String(mins%60).padStart(2,'0');
    const ph=tick===0?'arrival':tick<16?'morning':tick<20?'lunch':tick<31?'afternoon':'closing';
    clock.textContent=`day 0 · tick ${String(tick).padStart(2,'0')}/32 · ${hh}:${mm} · ${ph}`;
    els.forEach((e,i)=>{
      const n=NAMES[i];
      const a=lobby(i), b=desk(i);
      let k=P(t,2.4+i*.18,3.8+i*.18,E.io);
      let x=lerp(a[0],b[0],k), y=lerp(a[1],b[1],k);
      const mi=['Erin','Alex','Blake'].indexOf(n);
      if(mi>=0){const k2=P(t,6.2+mi*.2,7.6+mi*.2,E.io);x=lerp(x,meet[mi][0],k2);y=lerp(y,meet[mi][1],k2)}
      const o=P(t,.6+i*.08,1.1+i*.08);
      e.style.opacity=o; e.style.transform=`translate(${x}px,${y}px) scale(${lerp(.5,1,o)})`;
    });
    full.style.opacity=P(t,7.8,8.2);
    const g=P(t,6.8,7.3)*(1-P(t,9.5,10.2));
    R['meeting-room'].el.style.boxShadow=`0 0 0 ${g*4}px rgba(255,79,31,${.5*g})`;
    const z=kf(t,[[0,1],[5.5,1],[7,1.06],[10,1.06],[11,1]]);
    card.style.transform+=` scale(${z})`;
  };
});

/* 03 — Team & tasks */
const TASKS=[
  {id:'spec',o:'Alex',due:8,eff:6,x:520,y:300},
  {id:'api',o:'Blake',due:24,eff:10,x:760,y:178,dep:['spec']},
  {id:'ui',o:'Casey',due:26,eff:10,x:760,y:422,dep:['spec']},
  {id:'release-notes',o:'Frankie',due:30,eff:4,x:1000,y:110,dep:['api']},
  {id:'tests',o:'Drew',due:30,eff:6,x:1000,y:300,dep:['api','ui']},
  {id:'docs',o:null,due:30,eff:4,x:1000,y:490},
];
scene('팀과 업무',11.5,{caps:[[0,'여섯 명의 페르소나·직급·보고 라인. 매니저만 assign·approve·reject 권한.'],[4.6,'업무는 의존 그래프 — spec이 늦으면 api와 ui 두 사람이 막힙니다.'],[8.6,'갈등은 성격이 아니라 업무 구조에서 생기도록 설계했습니다.']],cursor:[[0,965,150],[4,560,330],[6.5,560,330],[8.8,1050,520],[9.2,1050,520,1],[11.5,1050,520]]},root=>{
  const cards=NAMES.map((n,i)=>mk(root,`<div class="abs card" style="left:56px;top:${74+i*82}px;width:330px;height:70px;border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 14px">
     <div style="position:relative;width:38px;height:38px;flex:none">${av(n,38)}</div>
     <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:16px">${n} ${n==='Erin'?'<span class="chip" style="background:#111;color:#fff;font-size:10px;padding:2px 7px;margin-left:4px">manager</span>':''}</div>
     <div style="font-size:12px;color:var(--muted)">${AG[n].r}${n!=='Erin'?' · reports_to Erin':''}</div></div>
     <div class="mono" style="width:34px;height:34px;border-radius:9px;background:#efede8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px" title="DISC">${AG[n].d}</div></div>`));
  const disc=mk(root,`<div class="abs lbl" style="left:56px;top:46px">AgentSpec · persona · DISC · title</div>`);
  const svg=mk(root,`<svg class="abs" style="left:0;top:0" width="1280" height="720"></svg>`);
  const W=180,H=84;
  const nodes={};
  TASKS.forEach(T=>{
    nodes[T.id]=mk(root,`<div class="abs card" style="left:${T.x-W/2}px;top:${T.y-H/2}px;width:${W}px;height:${H}px;border-radius:14px;padding:11px 13px;${T.o?'':'border:2px dashed rgba(0,0,0,.25);background:#f7f6f2;box-shadow:none'}">
      <div style="display:flex;align-items:center;gap:7px"><span class="mono" style="font-weight:700;font-size:14px">${T.id}</span>
      <span style="margin-left:auto;position:relative;width:22px;height:22px">${T.o?av(T.o,22):'<div class="mono" style="font-size:11px;color:var(--muted)">—</div>'}</span></div>
      <div class="mono" style="font-size:11px;color:var(--muted);margin:5px 0 7px">due t${T.due} · ${T.eff} ticks</div>
      <div class="bar"><i style="width:0%"></i></div>
      <div class="abs chip st" style="left:10px;top:-14px;opacity:0;font-size:10px;padding:3px 8px"></div></div>`);
  });
  const paths=[];
  TASKS.forEach(T=>(T.dep||[]).forEach(d=>{const S=TASKS.find(x=>x.id===d);
    const x1=S.x+W/2,y1=S.y,x2=T.x-W/2,y2=T.y,mx=(x1+x2)/2;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2-6} ${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','#111');p.setAttribute('stroke-width','2');
    svg.appendChild(p);const L=p.getTotalLength();p.style.strokeDasharray=L;paths.push({p,L,from:d,to:T.id});}));
  const perm=mk(root,`<div class="abs card" style="left:420px;top:600px;padding:10px 14px;border-radius:12px;font-size:13px;display:flex;gap:8px;align-items:center"><span class="lbl">org/flat</span><span class="mono">manager: assign · approve · reject · evaluate</span><span class="mono" style="color:var(--muted)">engineer/designer: —</span></div>`);
  return t=>{
    cards.forEach((c,i)=>pop(c,t,.2+i*.1,.5,14)); disc.style.opacity=P(t,.2,.7);
    TASKS.forEach((T,i)=>popS(nodes[T.id],t,2.4+i*.15));
    paths.forEach((e,i)=>{const k=P(t,3.4+i*.12,4.4+i*.12,E.io);e.p.style.strokeDashoffset=e.L*(1-k)});
    // spec progress & blocked chips
    nodes.spec.querySelector('.bar i').style.width=(kf(t,[[0,0],[5,0],[8,33]],E.lin))+'%';
    nodes.spec.querySelector('.bar i').style.background='var(--accent)';
    const sg=P(t,4.8,5.3)*(1-P(t,9,9.5));
    nodes.spec.style.boxShadow=`0 0 0 ${3*sg}px rgba(255,79,31,.55),0 24px 50px -24px rgba(40,30,15,.28)`;
    ['api','ui'].forEach((id,i)=>{const c=nodes[id].querySelector('.st');c.textContent='blocked by spec';c.style.background='var(--bad)';c.style.color='#fff';
      const k=P(t,5.6+i*.2,6+i*.2);c.style.opacity=k*(.75+.25*Math.sin(t*6));});
    paths.forEach(e=>{if(e.from==='spec'){e.p.setAttribute('stroke',t>5.4?'#e5383b':'#111')}});
    const dc=nodes.docs.querySelector('.st');dc.textContent='owner 없음 → manager가 assign';dc.style.background='#111';dc.style.color='#fff';dc.style.opacity=P(t,9.2,9.6);
    const pk=pop(perm,t,1.6,.5,10);
    const z=kf(t,[[0,1],[4.6,1],[6,1.04],[8.5,1.04],[9.5,1]]);
    root.style.transformOrigin='600px 330px';root.style.transform=`scale(${z})`;
  };
});

/* 04 — Agent anatomy */

    let acc=0;
    fr.forEach((f,i)=>{const a=.6+i*.36;const k=P(t,a,a+.35);f.style.opacity=k;f.style.transform=`translateY(${(1-k)*12}px)`;if(t>a+.35)acc+=R[i][3]});
    const g=Math.min(150,96+acc*1.35);
    const fired=t>4;
    gc.style.strokeDashoffset=C*(1-(fired?kf(t,[[4,1],[4.6,1],[5.2,0]]):g/150));
    gauge.querySelector('.gv').textContent=fired?(t<4.6?'150':'0'):Math.round(g);
    gc.style.stroke=t>3.7&&t<4.8?'var(--accent)':'#111';
    gauge.style.transform=`scale(${1+(t>3.9&&t<4.4?.06*Math.sin((t-3.9)*12):0)})`;
    pop(qs,t,4.4,.5,12);qs.querySelectorAll('.q').forEach((q,i)=>q.style.opacity=P(t,4.8+i*.3,5.1+i*.3));
    pop(ins,t,6.2,.5,12);
    links.forEach((l,j)=>{l.p.style.strokeDashoffset=l.L*(1-P(t,6.8+j*.15,7.6+j*.15,E.io));fr[l.i].style.boxShadow=t>7?'0 0 0 2px var(--gold)':''});
    strip.forEach((s,i)=>pop(s,t,8.6+i*.6,.5,10));
  };
});

/* 11 — Tick loop */
const STEPS=[['plan_day','출근: 하루 계획 (arrival)'],['_view','에이전트별 View 조립'],['perceive','표정·메시지를 기억'],['act','판단 (병렬 · 대부분 LLM 0회)'],['apply','환경 판정 · 거절 시 재선택'],['session.step','대화 진행 · 종료 시 평가'],['end_tick','상태 갱신 · 성찰'],['write_tick','이벤트·기억·프레임 기록']];
scene('틱 루프',11.5,{caps:[[0,'이 모든 것이 Loop.tick() 하나에서 32번 반복됩니다 — 하루가 끝나면 체크포인트.'],[6.2,'결과는 재현 가능한 기록으로: 이벤트·기억·뷰어 프레임·ConvoKit corpus.']]},root=>{
  const cx=470,cy=362,Rr=232;
  const ring=mk(root,`<svg class="abs" style="left:0;top:0" width="1280" height="720"><circle cx="${cx}" cy="${cy}" r="${Rr}" fill="none" stroke="#d9d6cf" stroke-width="2" stroke-dasharray="4 8"/><path class="arc" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/></svg>`);
  const arc=ring.querySelector('.arc');
  const nodes=STEPS.map(([k,d],i)=>{const a=-Math.PI/2+i/STEPS.length*Math.PI*2;const x=cx+Math.cos(a)*Rr,y=cy+Math.sin(a)*Rr;
    return mk(root,`<div class="abs card" style="left:${x-95}px;top:${y-34}px;width:190px;height:68px;border-radius:14px;padding:10px 12px;text-align:center">
      <div class="mono" style="font-weight:700;font-size:13.5px">${k}</div><div class="kr" style="font-size:11.5px;color:var(--muted);margin-top:3px">${d}</div></div>`)});
  const ctr=mk(root,`<div class="abs" style="left:${cx-110}px;top:${cy-60}px;width:220px;text-align:center"><div class="mono" style="font-size:12px;color:var(--muted)">Loop.tick()</div><div class="tk" style="font-weight:900;font-size:64px;letter-spacing:-.04em;line-height:1.1"></div><div class="mono ph" style="font-size:12px"></div></div>`);
  const files=[['events.jsonl','행동·판단·업무·결과'],['memory.sqlite','기억 + 검색 로그'],['frames.jsonl · inspect.jsonl','Phaser 뷰어 재생'],['checkpoints/day-n.json','하루 단위 재개'],['corpus/ + run.json','ConvoKit 대화 · CRAFT 채점']];
  const fc=mk(root,`<div class="abs" style="left:860px;top:110px;width:370px"><div class="lbl" style="margin-bottom:10px">runs/&lt;실행&gt;/</div></div>`);
  const fe=files.map(([f,d])=>mk(fc,`<div class="card" style="height:72px;border-radius:14px;padding:12px 16px;margin-bottom:12px;opacity:0"><div class="mono" style="font-weight:700;font-size:14px">${f}</div><div class="kr" style="font-size:12.5px;color:var(--muted);margin-top:3px">${d}</div></div>`));
  return t=>{
    ring.style.opacity=P(t,0,.5);
    nodes.forEach((n,i)=>popS(n,t,.2+i*.08));
    const prog=Math.max(0,(t-1)*1.6+Math.pow(Math.max(0,t-3.5),3)*.8); // accelerating
    const step=Math.floor(prog)%STEPS.length, tick=Math.min(31,Math.floor(prog/STEPS.length));
    nodes.forEach((n,i)=>{const on=t>1&&i===step;n.style.background=on?'#111':'var(--card)';n.style.color=on?'#fff':'var(--ink)';n.querySelector('.kr').style.color=on?'#bbb':'var(--muted)'});
    const frac=(prog%STEPS.length)/STEPS.length;
    const a0=-Math.PI/2,a1=a0+frac*Math.PI*2;
    const large=frac>.5?1:0;
    if(t>1&&frac>.001)arc.setAttribute('d',`M${cx+Math.cos(a0)*Rr} ${cy+Math.sin(a0)*Rr} A${Rr} ${Rr} 0 ${large} 1 ${cx+Math.cos(a1)*Rr} ${cy+Math.sin(a1)*Rr}`);else arc.setAttribute('d','');
    ctr.querySelector('.tk').textContent=`t ${String(t>1?tick:0).padStart(2,'0')}`;
    const tt=t>1?tick:0;ctr.querySelector('.ph').textContent=(tt===0?'arrival':tt<16?'morning':tt<20?'lunch':tt<31?'afternoon':'closing')+' · day 0';
    pop(ctr,t,.4);
    fe.forEach((f,i)=>pop(f,t,6.3+i*.25,.45,12));
  };
});

/* 12 — Outro */
scene('마무리',7,{caps:[[0,'API 키 없이 데모로 실행해 보세요.']],cursor:[[0,1100,600],[2.5,640,470],[3,640,470,1],[7,700,520]]},root=>{
  const title=mk(root,`<div class="abs" style="left:0;right:0;top:220px;text-align:center;font-weight:900;font-size:104px;letter-spacing:-.045em">ConflictDynamics<span style="color:var(--accent)">.</span></div>`);
  const sub=mk(root,`<div class="abs kr" style="left:0;right:0;top:358px;text-align:center;font-size:20px;color:#55524b">구조가 만든 마찰을, 기억과 관계로 관찰합니다.</div>`);
  const cmd=mk(root,`<div class="abs mono" style="left:50%;top:440px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:16px 28px;font-size:15px;white-space:nowrap">uv run conflict-sim --config-name company</div>`);
  const avs=NAMES.map((n,i)=>mk(root,`<div class="abs" style="left:${640-6*28+i*56}px;top:130px">${av(n,40)}</div>`));
  return t=>{
    const k=P(t,0,.7);st(title,{o:k,y:(1-k)*24});pop(sub,t,.5);
    const c=P(t,1,1.6,E.back);cmd.style.opacity=clamp((t-1)/.3);cmd.style.transform=`translateX(-50%) scale(${lerp(.7,1,c)*(t>3&&t<3.25?.96:1)})`;
    avs.forEach((a,i)=>popS(a,t,1.4+i*.1));
    if(t>5.6){const f=P(t,5.6,7);root.style.opacity=1-f}
  };
});

/* ============ engine ============ */
let acc=0;SCENES.forEach(s=>{s.start=acc;acc+=s.dur});
const TOTAL=acc;
SCENES.forEach((s,i)=>{s.el=document.createElement('div');s.el.className='scene';stage.insertBefore(s.el,document.getElementById('chapter'));s.update=s.build(s.el)});
const capEl=document.getElementById('cap'),capTxt=capEl.querySelector('span'),capNo=capEl.querySelector('b');
const chapEl=document.getElementById('chapter'),cursor=document.getElementById('cursor'),ripple=document.getElementById('ripple');
// global cursor track
const CUR=[];SCENES.forEach(s=>(s.cursor||[]).forEach(([lt,x,y,c])=>CUR.push([s.start+lt,x,y,c])));
CUR.sort((a,b)=>a[0]-b[0]);
function cursorAt(T){
  if(!CUR.length)return null;
  let i=CUR.findIndex(c=>c[0]>T);
  if(i===-1)return CUR[CUR.length-1];if(i===0)return CUR[0];
  const a=CUR[i-1],b=CUR[i];const k=E.io((T-a[0])/(b[0]-a[0]));return[T,lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
}
let lastCap='';
function render(T){
  T=clamp(T,0,TOTAL);
  let cur=null;
  SCENES.forEach((s,i)=>{
    const lt=T-s.start, fade=.35;
    const vis=lt>-fade&&lt<s.dur+fade;
    s.el.style.visibility=vis?'visible':'hidden';
    if(!vis)return;
    let o=1;if(i>0&&lt<fade)o=clamp((lt+fade)/(2*fade));if(i<SCENES.length-1&&lt>s.dur-fade)o=clamp((s.dur+fade-lt)/(2*fade));
    s.el.style.opacity=o;
    s.update(Math.max(0,lt));
    if(lt>=0&&lt<s.dur)cur={s,i,lt};
  });
  if(!cur)cur={s:SCENES[SCENES.length-1],i:SCENES.length-1,lt:SCENES[SCENES.length-1].dur};
  const {s,i,lt}=cur;
  let txt='';(s.caps||[]).forEach(([a,c])=>{if(lt>=a)txt=c});
  if(txt!==lastCap){capTxt.textContent=txt;lastCap=txt}
  capNo.textContent=String(i+1).padStart(2,'0');
  const ck=Math.min(P(lt,0,.4),1-P(lt,s.dur-.35,s.dur));
  capEl.style.opacity=txt?ck:0;
  capEl.classList.toggle('dark',!!s.dark);
  chapEl.textContent=`${String(i+1).padStart(2,'0')} / ${String(SCENES.length).padStart(2,'0')} — ${s.title}`;
  chapEl.style.color=s.dark?'#aab':'var(--muted)';
  // cursor
  const c=cursorAt(T);const show=!!(s.cursor);
  cursor.style.opacity=show?Math.min(1,P(lt,0,.3),1-P(lt,s.dur-.3,s.dur)):0;
  if(c){cursor.style.transform=`translate(${c[1]-4}px,${c[2]-2}px)`;}
  let rp=0,rx=0,ry=0;CUR.forEach(q=>{if(q[3]&&T>=q[0]&&T<q[0]+.5){rp=(T-q[0])/.5;rx=q[1];ry=q[2]}});
  ripple.style.opacity=rp?1-rp:0;ripple.style.left=rx+'px';ripple.style.top=ry+'px';ripple.style.transform=`scale(${.4+rp})`;
  // controls
  const f=T/TOTAL;fill.style.width=f*100+'%';knob.style.left=f*100+'%';
  timeEl.textContent=`${fmt(T)} / ${fmt(TOTAL)}`;chapCtl.textContent=s.title;
}
const fmt=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
const fill=document.querySelector('#track .fill'),knob=document.querySelector('#track .knob'),track=document.getElementById('track'),timeEl=document.getElementById('time'),chapCtl=document.getElementById('chap'),playBtn=document.getElementById('play');
SCENES.forEach(s=>{const m=document.createElement('div');m.className='mk';m.style.left=(s.start/TOTAL*100)+'%';m.title=s.title;track.appendChild(m)});
let T=0,playing=true,last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){T+=dt;if(T>=TOTAL){T=TOTAL;playing=false;playBtn.textContent='▶'}}render(T);requestAnimationFrame(frame)}
function setPlay(p){playing=p;if(p&&T>=TOTAL)T=0;playBtn.textContent=p?'❚❚':'▶'}
playBtn.onclick=()=>setPlay(!playing);
document.getElementById('restart').onclick=()=>{T=0;setPlay(true)};
let drag=false;const seek=e=>{const r=track.getBoundingClientRect();T=clamp((e.clientX-r.left)/r.width)*TOTAL};
track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);seek(e)});
track.addEventListener('pointermove',e=>{if(drag)seek(e)});track.addEventListener('pointerup',()=>drag=false);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
  if(e.code==='ArrowRight'){const n=SCENES.find(s=>s.start>T+.05);T=n?n.start:TOTAL}
  if(e.code==='ArrowLeft'){const p=[...SCENES].reverse().find(s=>s.start<T-.6);T=p?p.start:0}
});
function fit(){const W=innerWidth,H=innerHeight-56;const s=Math.min(W/1280,H/720)*.97;stage.style.transform=`scale(${s})`;stage.style.left=((W-1280*s)/2)+'px';stage.style.top=((H-720*s)/2)+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);if(q.has('t')){T=+q.get('t');}if(q.has('paused'))setPlay(false);
requestAnimationFrame(frame);
</script>
